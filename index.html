<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vis Lab · 可视化组件库</title>
  <meta name="description" content="Vis Lab：design token 驱动的可视化组件与规范，覆盖 THS、iFinD-PC、Ainvest 三主题的九类图表示例。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='8' width='3' height='6' rx='1' fill='%231f2329'/%3E%3Crect x='6.5' y='4' width='3' height='10' rx='1' fill='%231f2329'/%3E%3Crect x='11' y='6' width='3' height='8' rx='1' fill='%231f2329'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./tokens/tokens.css" />
  <link rel="stylesheet" href="./charts/styles.css" />
  <link rel="stylesheet" href="./demos/playback/playback.css" />
  <link rel="stylesheet" href="./site/site.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#all" aria-label="Vis Lab 首页">
      <span class="brand__copy">
        <span class="brand__name"><span>Vis</span><span class="brand__name-accent">Lab</span></span>
        <span class="brand__sub">可视化组件库</span>
      </span>
    </a>
    <nav class="topnav" aria-label="主导航">
      <a class="topnav__item topnav__item--active" href="#all" data-view="examples">图表示例</a>
      <a class="topnav__item" href="#spec" data-view="spec">设计规范</a>
    </nav>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar">
      <!-- 无抬头、无计数：顶栏已经写着「Vis Lab / 可视化组件库」，
           这里再来一个标题是复述；数量在导航里是噪音，总数画廊标题右侧就有。
           图表族名一律由 CHART_FAMILIES 派生并渲染进导航分节，不写死组件名。 -->
      <div class="search">
        <div class="search__wrap">
          <input class="search__input" id="search-input" type="search" placeholder="搜索示例" aria-label="搜索图表示例" />
          <button class="search__clear" id="search-clear" type="button">清除</button>
        </div>
      </div>
      <nav class="category-nav" id="category-nav" aria-label="图表分类"></nav>
      <p class="sidebar__hint"><kbd>←</kbd> <kbd>→</kbd> 换图，旋钮保持不变</p>
    </aside>
    <main class="main" id="main-content"></main>
  </div>

  <!-- 固定 d3 版本：浮动的 d3@7 会在上游发版当天悄悄换掉线上依赖。四个预览面各有一份，升级时一起改。 -->
  <script type="importmap">
    { "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm" } }
  </script>
  <script>
    /* d3 走 CDN：模块图加载失败时页面只会空白、没有任何提示。模块开头会打上 data-ready，
       超时仍未打上就给出可见提示，而不是让人对着空页面猜。 */
    setTimeout(() => {
      if (document.documentElement.dataset.ready) return;
      const main = document.getElementById('main-content');
      if (main) main.innerHTML = '<p style="padding:40px 24px;color:#646a73">图表库加载失败，可能是网络无法访问 cdn.jsdelivr.net。请检查网络后刷新页面。</p>';
    }, 10000);
  </script>
  <script type="module" src="./site/app.js"></script>
</body>
</html>
