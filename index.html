<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vis Lab · 可视化组件库</title>
  <link rel="stylesheet" href="./tokens/tokens.css" />
  <link rel="stylesheet" href="./charts/styles.css" />
  <link rel="stylesheet" href="./demos/sankey-playback.css" />
  <style>
    /* ⚠️ 本文件的 `--shell-*` 只管**外壳**（导航、卡片、面板）。演示区里图表自己的
       颜色 / 字号 / 圆角一律来自 tokens.css 的三套主题，外壳换皮不许波及它们——
       否则这个面就不再能用来验收主题了。见下面 .stage__surface 那条「不上玻璃」的说明。 */
    /* ── 外壳风格：ChatGPT ────────────────────────────────────────
       它和 iOS 那套在三件事上是**相反的**，照搬一半会两不像：
       ① **不用半透明材质**——侧栏是一块实心浅灰，不是磨砂玻璃；靠**明度差**分区，不靠透视。
       ② **面板贴边、不浮起**——没有外留白 / 圆角 / 投影；圆角只出现在**内容块**上，容器不圆。
       ③ **圆角收小一档**——列表项 10、卡片 16，不是 iOS 那种 24/30。
       主色仍是黑（ChatGPT 的主按钮也是黑），这一条两边一致，故不动。 */
    :root {
      color-scheme: light;
      --shell-brand: #0d0d0d;
      --shell-brand-weak: rgba(13, 13, 13, .06);
      --shell-link: #0d0d0d;
      /* 底色分两层：主内容纯白、侧栏与参数面板浅灰。ChatGPT 的分区全靠这一档明度差，
         所以这两个值不能都设成白——那样贴边的面板就彻底看不出边界了。 */
      --shell-bg: #ffffff;
      --shell-rail: #f9f9f9;            /* 侧栏 / 参数面板底色 */
      --shell-panel: #ffffff;
      --shell-weak: rgba(0, 0, 0, .05);
      --shell-divider: rgba(0, 0, 0, .07);
      --shell-divider-strong: rgba(0, 0, 0, .13);
      --shell-text: #0d0d0d;
      --shell-text-2: #5d5d5d;
      --shell-text-3: #8f8f8f;
      --shell-text-4: #b4b4b4;
      --shell-dark: #1a1b1e;
      --shell-hover: rgba(0, 0, 0, .04);
      --shell-active: rgba(0, 0, 0, .07);   /* 选中项的浅灰底：比 hover 深一档、不用黑块 */
      --shell-click: rgba(0, 0, 0, .1);
      --shell-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      --shell-chart-shadow: 0 2px 10px rgba(0, 0, 0, .06);

      /* ── 圆角刻度 ──────────────────────────────────────────────
         仍然只给一把刻度、各处只准引用（同一层级圆角必须相同），但整体比 iOS 那版小一档：
         ChatGPT 的圆角克制，大圆角只留给输入框那类胶囊。 */
      --r-xs: 6px;    /* 内嵌小块：指示器、代码块内 */
      --r-sm: 10px;   /* 行级可点元素：导航项、分段项 */
      --r-md: 12px;   /* 内容块：代码块、演示外壳 */
      --r-lg: 16px;   /* 卡片 */
      --r-xl: 16px;   /* 最外层容器——与卡片同档，不再单独放大 */
      --r-pill: 999px;/* 胶囊：搜索框、按钮、标签 */

      /* 本页**最小字号 12px**：11 及以下在 1x 屏与中文字形上已经开始糊，
         而这是一份要被逐像素比对的规范面，说明文字读不清等于没有。
         新增样式时不要往下破这个底，需要更弱就调字色（--shell-text-3/4），不要调字号。
         ⚠️ 落到底的地方**一律引用本变量、不写 12px 字面量**：写死的话这条底就成了一句
         没人执行的注释，改底也要满文件找。现在改这一个值，所有最小字同时跟着走。 */
      --font-min: 12px;

      --topbar-h: 56px;
      --sidebar-w: 260px;
      --settings-w: 320px;
      --content-max: 1280px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    /* ── 滚动条：细、无轨道底色 ────────────────────────────────
       轨道一旦有底色，一条灰槽就会常驻在版面上，等于凭空多一条纵向分割线。
       这里只留一枚半透明滑块，悬停才加深；macOS 的浮层滚动条本来就是这个行为，
       这条规则是把 Windows / 外接鼠标那侧也拉齐。
       ⚠️ 选择器**逐个列出滚动容器，不用 `*`**：`.stage__surface` 是 resize:both 的，
       一旦给它套上自定义 webkit 滚动条，右下角的原生缩放手柄画法会跟着受影响——
       那个手柄是这个面的主要交互，不值得为统一样式冒险。 */
    html, .category-nav, .settings, .detail__main, .stage__canvas, .code-block {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, .16) transparent;
    }
    html::-webkit-scrollbar, .category-nav::-webkit-scrollbar, .settings::-webkit-scrollbar,
    .detail__main::-webkit-scrollbar, .stage__canvas::-webkit-scrollbar, .code-block::-webkit-scrollbar {
      width: 6px; height: 6px; background: transparent;
    }
    html::-webkit-scrollbar-track, .category-nav::-webkit-scrollbar-track, .settings::-webkit-scrollbar-track,
    .detail__main::-webkit-scrollbar-track, .stage__canvas::-webkit-scrollbar-track, .code-block::-webkit-scrollbar-track {
      background: transparent;
    }
    html::-webkit-scrollbar-thumb, .category-nav::-webkit-scrollbar-thumb, .settings::-webkit-scrollbar-thumb,
    .detail__main::-webkit-scrollbar-thumb, .stage__canvas::-webkit-scrollbar-thumb, .code-block::-webkit-scrollbar-thumb {
      border-radius: var(--r-pill); background: rgba(0, 0, 0, .16);
    }
    html::-webkit-scrollbar-thumb:hover, .category-nav::-webkit-scrollbar-thumb:hover, .settings::-webkit-scrollbar-thumb:hover,
    .detail__main::-webkit-scrollbar-thumb:hover, .stage__canvas::-webkit-scrollbar-thumb:hover, .code-block::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, .3);
    }
    body {
      margin: 0;
      background: var(--shell-bg);
      color: var(--shell-text);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* 顶栏：实心白 + 一条发丝线。ChatGPT 不做磨砂，分区靠明度与线，不靠透视 */
    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--shell-divider);
      background: var(--shell-panel);
    }
    .brand {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 4px 8px;
      border-radius: var(--r-sm);
    }
    .brand::before {
      content: "";
      width: 3px;
      height: 32px;
      margin-right: 12px;
      border-radius: var(--r-pill);
      background: var(--shell-brand);
    }
    .brand__copy { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
    .brand__name { display: flex; gap: 6px; font-size: 18px; line-height: 22px; font-weight: 600; }
    .brand__name-accent { color: var(--shell-text-3); font-weight: 500; }
    .brand__sub { color: var(--shell-text-3); font-size: var(--font-min); line-height: 16px; }
    .topnav { align-self: stretch; display: flex; gap: 24px; }
    .topnav__item {
      position: relative;
      display: flex;
      align-items: center;
      color: var(--shell-text-2);
      font-size: 14px;
      line-height: 18px;
    }
    .topnav__item:hover { color: var(--shell-text); }
    .topnav__item--active { color: var(--shell-brand); font-weight: 500; }
    .topnav__item--active::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      border-radius: var(--r-pill);
      background: var(--shell-brand);
    }

    .workspace { min-height: 100vh; padding-top: var(--topbar-h); }
    /* 详情页**保留**左侧导航：藏起来会让「换一张图」只剩面包屑回画廊再点一次这一条路，
       而看规范时最常做的恰恰是同一套旋钮下横着比几张图。窄屏才让位——见 1180px 断点。 */
    /* 侧栏：贴边整列、实心浅灰、无圆角无投影。
       与主内容的分界**只靠底色差一档**（--shell-rail vs --shell-bg）——
       ChatGPT 连那条竖分割线都不画，明度差自己就说清楚了。 */
    .sidebar {
      position: fixed;
      inset: var(--topbar-h) auto 0 0;
      z-index: 10;
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--shell-rail);
    }
    .search { padding: 12px 12px 8px; }
    /* 搜索框：白底 + 描边的圆角矩形。浅灰侧栏上再放一块浅灰会糊在一起，
       所以这里反过来用白底把输入区「抬」出来——同 ChatGPT 侧栏里的搜索行。 */
    .search__wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--shell-divider);
      border-radius: var(--r-sm);
      background: var(--shell-panel);
    }
    .search__input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: var(--shell-text);
      font-size: 14px;
    }
    .search__input::placeholder { color: var(--shell-text-4); }
    .search__clear {
      display: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--shell-text-3);
      cursor: pointer;
      font-size: var(--font-min);
    }
    .search__clear.is-visible { display: block; }
    /* --nav-icon / --nav-gap 同时决定**分类图标占多宽**与**示例缩进多少**：
       示例要和分类的文字左沿对齐，那个位置 = 行内边距 + 图标宽 + 图标间距。
       写成一条公式，改图标尺寸时对齐自动跟上，不用两处手动同步。 */
    .category-nav { --nav-icon: 16px; --nav-gap: 8px; flex: 1; overflow-y: auto; padding: 0 10px 12px; }
    /* ── 三级的轻重次序：示例 > 分类 > 族 ────────────────────────────
       **最常点的那一级必须最重**。此前分类是 14px、全导航最大，比真正的落点（示例 13px）
       还显眼，且两级共用同一套按钮装饰——二级把三级压住了，正好反了。
       现在分类降成「可点的小标题」：字更小更浅、**不给底色**，只在 hover 时提字色；
       行装饰（圆角 + 底色）成为示例独有的记号，扫一眼就知道哪些是能落地的目标。 */
    .nav-item {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      border: 0;
      border-radius: var(--r-xs);
      padding: 5px 12px;
      background: transparent;
      gap: var(--nav-gap);
      color: var(--shell-text-3);
      cursor: pointer;
      text-align: left;
      /* 与示例同为 14px：**两级不再靠字号区分**，轻重全交给字色（灰 vs 正文色）
         与行装饰（分类无底色 / 示例有底色）。字号一致时这两样必须保住，
         否则同号同色的两级会立刻糊成一片。 */
      font-size: 14px;
      font-weight: 500;
      transition: color .15s;
    }
    /* 图标随字色走（currentColor），故选中/当前态不用再单独给图标上色 */
    .nav-item__icon { flex: none; width: var(--nav-icon); height: var(--nav-icon); }
    .nav-item:hover { color: var(--shell-text); }
    /* 画廊正筛这一类 / 当前示例在这一节：都只提字色与字重，**不占用底色**——
       底色是示例那一级的记号，二级借走就又把两级拉平了。 */
    .nav-item--active,
    .nav-item--current { color: var(--shell-text); font-weight: 600; }
    /* ⚠️「全部示例」不跟着降权：它是跨族入口、和下面的分类不是同一级，
       仍按「行」来做（与示例同档），否则整个导航就没有一个明确的起点了。 */
    .category-nav > .nav-item:first-child {
      border-radius: var(--r-sm);
      padding: 7px 12px;
      color: var(--shell-text);
      font-size: 14px;
      font-weight: 400;
      transition: background .15s, color .15s;
    }
    .category-nav > .nav-item:first-child:hover { background: var(--shell-hover); }
    .category-nav > .nav-item--active:first-child { background: var(--shell-active); font-weight: 500; }
    /* 族标题：只作分节说明、不可点——可点的最小单位仍是「分类」，
       族本身要看全部时走顶部的「全部示例」。刻意不做成按钮态，免得像个失效按钮。 */
    /* 导航里**只留这一条线**：「全部示例」是跨族入口，与下面那份按族分好的清单
       不是同一类东西，这个断点靠间距说不清楚，值得一条线。族与族之间则相反——
       它们是并列的同类，用间距分节就够，画线只会把清单切成五个孤岛。 */
    .nav-divider { height: 1px; margin: 8px 4px 2px; background: var(--shell-divider); }

    /* 族标题：分节靠留白。margin-top 是族与族之间唯一的分隔手段，
       所以它必须明显大于族内「分类 → 示例」的行距，否则层级就塌了。 */
    /* 族与族之间画线分节。线比留白更硬，代价是把清单切成几段——但这里正是要那个效果：
       一条线 = 一个 L2 组件的边界，跨过它就是换了一族图表。 */
    .nav-family {
      display: flex; align-items: center;
      margin-top: 2px;
      border-top: 1px solid var(--shell-divider);
      padding: 16px 12px 10px;   /* 下内边距 = 族标题与第一个分类之间的间距 */
    }
    /* 第一族上方已经有「全部示例」那条线，不再叠第二条 */
    .nav-divider + .nav-family { margin-top: 4px; border-top: 0; padding-top: 6px; }
    .nav-family__title { font-size: var(--font-min); font-weight: 600; letter-spacing: .06em; color: var(--shell-text-4); }
    /* 示例本身。分类只是筛画廊，**能一步到位换图的最小单位是示例**，
       所以它必须自己出现在导航里，而不是藏在画廊卡片后面。
       归属改由缩进单独表达——导轨那条竖线撤了：当前项换成实心胶囊之后，
       「我在哪」已经有一个足够强的标记，再加一条线就是两套记号说同一件事。 */
    /* 示例左沿与**分类的文字**对齐（不是与分类的行首对齐）：分类前面多了一枚图标，
       示例跟着退让出同样的宽度，两级文字才排在同一条竖线上。
       padding = 图标宽 + 图标间距，示例自身的 12px 行内边距与分类的那份重合。 */
    /* 下外边距 = **分类与分类之间**的间距。三档间距必须依次拉开，
       否则层级就只剩缩进在撑：示例之间 0 < 分类之间 14 < 族之间（还叠一条线）。 */
    .nav-examples {
      display: flex; flex-direction: column; margin: 2px 0 14px;
      padding-left: calc(var(--nav-icon) + var(--nav-gap));
    }
    .nav-example {
      position: relative;
      border-radius: var(--r-sm);
      padding: 7px 12px;
      color: var(--shell-text);
      text-decoration: none;
      font-size: 14px;
    }
    /* 省略号必须裁在**内层**：`overflow:hidden` 放在外层会把下面那根左色条一起裁掉
       （它画在盒子外的导轨上），于是「当前项」就只剩一块淡蓝底。 */
    .nav-example > span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .nav-example:hover { background: var(--shell-hover); color: var(--shell-text); }
    /* 当前项 = 浅灰圆角块 + 字色提到正文色。ChatGPT 的选中项就是这一档——
       比 hover 深一级、不反白。整列都是黑白灰时，一块实心黑会重得像个按钮而不是「当前位置」。 */
    .nav-example--active,
    .nav-example--active:hover { background: var(--shell-active); color: var(--shell-text); font-weight: 500; }
    .sidebar__hint { padding: 6px 16px 14px; color: var(--shell-text-4); font-size: var(--font-min); line-height: 16px; }
    .sidebar__hint kbd {
      display: inline-block; min-width: 16px; border: 1px solid var(--shell-divider-strong); border-radius: 5px;
      padding: 0 3px; background: rgba(255, 255, 255, .7); color: var(--shell-text-3);
      text-align: center; font: inherit;
    }

    .main { min-height: calc(100vh - var(--topbar-h)); margin-left: var(--sidebar-w); }
    .gallery { width: min(100%, var(--content-max)); margin: 0 auto; padding: 40px 24px 64px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .page-head h1 { margin: 0 0 8px; font-size: 24px; line-height: 30px; }
    .page-head p { max-width: 680px; margin: 0; color: var(--shell-text-2); font-size: 14px; line-height: 20px; }
    .page-head__meta { flex: none; color: var(--shell-text-3); font-size: 13px; }
    .gallery-section + .gallery-section { margin-top: 40px; }
    .section-title { margin: 0 0 16px; font-size: 18px; line-height: 22px; font-weight: 500; }
    .example-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 292px), 1fr)); gap: 20px; }
    .example-card {
      position: relative;
      min-width: 0;
      /* 卡片作 column flex，好让预览区 flex:1 吸走网格拉伸出来的高度（见 .example-card__preview） */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--shell-divider);
      border-radius: var(--r-lg);
      background: var(--shell-panel);
      cursor: pointer;
      /* ChatGPT 的卡片不上浮也不加投影：hover 只把底色压深一档。
         位移会让整片网格在指针扫过时此起彼伏，那是「活泼」不是「克制」。 */
      transition: background .15s, border-color .15s;
    }
    .example-card:hover { border-color: var(--shell-divider-strong); background: var(--shell-rail); }
    .example-card:focus-visible { outline: 2px solid var(--shell-brand); outline-offset: 2px; }
    /* 预览区把图表**竖直居中**。以前只写 min-height:210 就完事，比它矮的图会贴顶——
       饼环自然高只有 2R（THS 140），186 的内容区里下方白 46px，看着就是「整张图偏上」。
       与 .stage__canvas 当初同一个坑，这里补同一条治法。
       flex:1 是另一半：网格默认 stretch，同行有更高的卡片时整张卡被拉高，
       预览区不吸走这段高度的话，空白会落到标题行**下面**（实测搜索结果混排时饼卡底部空 28px）。
       用 margin:auto 而不是 align-items:center——本块 overflow:hidden，图比容器高时
       后者连顶部一起裁，auto 边距在余量为负时退化成 0、只裁下边。 */
    .example-card__preview { flex: 1; display: flex; min-height: 210px; padding: 14px 14px 4px; overflow: hidden; }
    .example-card__preview .chart-host { width: 100%; margin: auto 0; pointer-events: none; }
    /* 桑基在卡片里的收缩覆盖。两个 !important 是**必需**的：组件用
       `.dv-sankey { min-width: var(--dv-sankey-render-width, 100%) }` 把容器顶到算出来的图宽
       （详情页量到 1152px），卡片只有 268px，不解除就横向撑爆整张卡。
       ⚠️ 上面那条通用规则已把预览区做成居中的 flex 容器，故这里**不再写
       `height: 210px`**——`flex:1` 的 flex-basis:0% 本就压过 height，那行是死代码。
       图例在卡片里藏掉：卡片是缩略图，静态色卡挤掉的是图本身的高度。 */
    .example-card[data-chart="sankey"] .dv-sankey {
      min-width: 0 !important;
      min-height: 0 !important;
      max-height: 185px;
      overflow: hidden;
    }
    .example-card[data-chart="sankey"] .dv-sankey__legend-host { display: none; }
    .example-card[data-chart="sankey"] .dv-sankey__svg { width: 100%; height: 185px; }
    .example-card__body { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; }
    .example-card__title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 500; }
    .example-card__tag { flex: none; color: var(--shell-text-3); font-size: var(--font-min); }
    .empty-state { min-height: 280px; display: grid; place-items: center; border: 1px solid var(--shell-divider); border-radius: var(--r-lg); background: var(--shell-panel); color: var(--shell-text-2); }

    .detail { min-height: calc(100vh - var(--topbar-h)); display: grid; grid-template-columns: minmax(0, 1fr) var(--settings-w); }
    .detail__main { min-width: 0; padding: 24px; overflow: auto; }
    .detail-head, .stage { max-width: 960px; margin-right: auto; margin-left: auto; }
    .detail-head { margin-bottom: 20px; }
    .breadcrumb { display: flex; align-items: center; min-width: 0; gap: 8px; margin-bottom: 16px; color: var(--shell-text-3); font-size: 13px; }
    .breadcrumb__link { flex: none; color: var(--shell-link); }
    .breadcrumb__link:hover { text-decoration: underline; }
    .breadcrumb__separator { color: var(--shell-text-4); }
    .breadcrumb__current { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--shell-text-2); }
    .detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .detail-title-row h1 { margin: 0 0 8px; font-size: 20px; line-height: 24px; }
    .detail-title-row p { max-width: 720px; margin: 0; color: var(--shell-text-2); font-size: 13px; line-height: 18px; }
    .spec-chip { flex: none; padding: 5px 10px; border-radius: var(--r-xs); background: var(--shell-brand-weak); color: var(--shell-brand); font-size: var(--font-min); font-weight: 500; }
    /* --stage-bar-h 同时喂给抬头的高度和台面的底部留白，两者不会各改各的走散 */
    .stage { --stage-bar-h: 44px; overflow: hidden; border: 1px solid var(--shell-divider); border-radius: var(--r-xl); background: var(--shell-panel); }
    .stage__bar { min-height: var(--stage-bar-h); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 20px; }
    .stage__theme { flex: none; font-size: 13px; font-weight: 500; }
    .stage__meta { min-width: 0; overflow: hidden; color: var(--shell-text-3); font-size: var(--font-min); text-overflow: ellipsis; white-space: nowrap; }
    .stage__period { color: var(--shell-text-2); font-weight: var(--font-weight-medium); }
    /* 演示区把外壳**两个方向都居中**。以前外壳写死 420px 高、正好撑满这块，
       看不出没做垂直居中；改成「高度由图表撑开」后矮图（如饼环只有 2R）就会贴顶。
       用 flex + 子元素 margin:auto 而不是 align-items:center —— 这块 overflow:auto，
       后者在内容比容器高时会把顶部溢出到滚不到的地方，auto 边距不会。 */
    /* 演示区**保持白底**：图表就落在这块上，底色一变，读到的对比度、水印浓淡就不是
       它在真实白底产品里的样子了——这个面存在的理由正是量这些。分界交给下面那张
       演示外壳自己的描边与投影，不靠给台面换色。 */
    /* 演示外壳靠 margin:auto 在台面里居中，但**卡片**顶上还压着一条抬头——
       只在台面里居中，相对整张卡片就恒偏低一个抬头高（实测四个示例都正好差 44px）。
       故底部多留一个抬头的高度，把居中的参照系从「台面」提到「卡片」；
       min-height 同步加高，免得内容区被这段留白挤薄、高图反而溢出。 */
    .stage__canvas {
      min-height: calc(360px + var(--stage-bar-h));
      padding: 40px 24px calc(40px + var(--stage-bar-h));
      overflow: auto; display: flex;
    }
    /* 演示外壳：**只给初始宽度，不给固定宽高**——高度由图表自然撑开、宽度可自由拖，
       两个方向都随容器自适应（resize:both + ResizeObserver）。默认宽按端分：
       PC 736 / 移动端取分辨率选择器给的那一档，与 playground 的卡片同一口径。 */
    .stage__surface {
      position: relative;
      display: flex;              /* 单个 host 子项，配 margin:auto 做竖直居中 */
      min-width: 320px;
      min-height: 160px;          /* resize 的下限，两个方向都恒定生效（与 playground 卡片同口径 320×160） */
      max-width: 100%;
      width: min(100%, var(--chart-preferred-width, 736px));
      margin: auto;   /* 左右 + 上下都居中（见 .stage__canvas 的说明） */
      padding: 16px;
      overflow: auto;
      resize: both;
      border: 1px solid var(--shell-divider);
      /* 圆角刻意比外壳低两档（外层演示台 --r-xl、卡片 --r-lg）：这一块代表的是
         **产品里真实的图表容器**，不是外壳自己的装饰，跟着外壳做大圆角会让人误以为
         组件自带这么大的圆角。外壳越圆，它越要收着。 */
      border-radius: var(--r-sm);
      /* ⚠️ 这一块**只跟圆角、绝不上玻璃**：它是图表落地的那张底。半透明 + 背景模糊会把
         底下的东西透进来，图表的颜色、对比度、水印浓淡就都不是真值了——而这个面存在的
         理由正是「量」这些值。外壳其余部分可以随便换皮，唯独这里必须是不透明纯色。 */
      background: var(--shell-panel);
      box-shadow: var(--shell-chart-shadow);
      transition: background .16s, border-color .16s, box-shadow .16s;
    }
    .stage__surface[data-platform="mobile"] {
      /* `--mobile-chart-width` 表示图表净宽，不含演示外壳的 16px 内边距与 1px 边框。 */
      box-sizing: content-box;
      max-width: 100%;
      width: min(calc(100% - 34px), var(--mobile-chart-width));
    }
    .stage__surface[data-mode="dark"] { background: var(--shell-dark); border-color: rgba(255, 255, 255, .16); box-shadow: 0 10px 28px rgba(0, 0, 0, .22); }
    /* 高度**不定死**：host 高度 auto，由组件按 --size-chart-region-height 自然撑开——
       那个 token 本身按主题分化（THS 160 / iFinD-PC 200 / Ainvest 200），所以「不同主题
       默认多高」由 token 说了算，外壳一个数都不写死（与 playground 的卡片同一套做法）。
       margin:auto 让它在被 min-height（或用户拖出的高度）撑高时仍竖直居中，不贴顶。 */
    .stage__surface .chart-host { width: 100%; height: auto; margin: auto 0; }
    /* 拖动之后高度交给容器：本类**只切 host 的高度口径，不设 surface 的 height**。
       ⚠️ 这里写死一个 height 会让卡片在 pointerdown 的瞬间就从「内容高」跳到那个数——
       手还没动，尺寸先变了。resize 手柄本就会从当前渲染尺寸开始写 inline 宽高，无需代劳。 */
    .stage__surface.is-resized .chart-host { height: 100%; }
    .stage__surface[data-playback="true"] { display: block; }
    .chart-playback-layout {
      --chart-playback-chart-height: 243px;
      --sankey-playback-height: 88px;
      --sankey-playback-timeline-height: calc(var(--spacing-20) + var(--spacing-16));
      --sankey-playback-control-height: calc(var(--spacing-20) + var(--spacing-8));
      --sankey-playback-label-gap: var(--spacing-8);
      --sankey-playback-label-max-width: calc(var(--spacing-24) * 4);
      display: grid;
      grid-template-rows: var(--chart-playback-chart-height) var(--sankey-playback-height);
      width: 100%;
      min-width: 0;
    }
    .chart-playback-layout > .chart-host {
      min-width: 0;
      height: var(--chart-playback-chart-height);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x pan-y;
    }
    .chart-playback-layout > .chart-host::-webkit-scrollbar { display: none; }
    .stage__surface[data-playback="true"].is-resized .chart-playback-layout {
      grid-template-rows: minmax(calc(var(--spacing-24) * 5), 1fr) var(--sankey-playback-height);
      height: 100%;
    }
    .stage__surface[data-theme="ainvest"] .chart-playback-layout {
      --sankey-playback-height: 110px;
      --sankey-playback-timeline-height: 46px;
      --sankey-playback-control-height: 36px;
    }
    /* 播放区视觉与 DOM 模板统一由 demos/sankey-playback.* 提供。 */

    /* 参数面板与侧栏同形态：贴边、实心浅灰、无圆角无投影，只用一条左发丝线收边 */
    .settings {
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      overflow-y: auto;
      border-left: 1px solid var(--shell-divider);
      background: var(--shell-rail);
    }
    /* 页签底下不通栏画线：选中态已有指示条，那条线只是又一次说「上面和下面是两块」 */
    .tab { padding-bottom: 4px; }
    .tab__list { display: flex; height: 40px; padding: 0 16px; }
    .tab__item { position: relative; flex: 1; border: 0; background: transparent; color: var(--shell-text-2); cursor: pointer; font-size: 14px; }
    .tab__item--active { color: var(--shell-text); font-weight: 500; }
    .tab__indicator { position: absolute; inset: auto 50% 0 auto; width: 16px; height: 3px; transform: translateX(50%); border-radius: var(--r-pill); background: var(--shell-brand); opacity: 0; }
    .tab__item--active .tab__indicator { opacity: 1; }
    .settings__panel { padding: 16px; }
    .settings__panel[hidden] { display: none; }
    /* 每个旋钮一条下划线 = 面板里十来条横线，是本页线最密的地方。
   改用留白分隔：字号与字重的落差（14/500 的标题 + 11 的说明）足够分组。 */
    .field { padding: 14px 0; }
    .field:first-child { padding-top: 4px; }
    .field__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .field__copy { min-width: 0; }
    .field__label { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 500; }
    .field__hint { display: block; margin-top: 4px; color: var(--shell-text-3); font-size: var(--font-min); line-height: 16px; }
    .select { width: 128px; min-width: 0; border: 1px solid var(--shell-divider-strong); border-radius: var(--r-sm); padding: 8px 12px; outline: 0; background: var(--shell-panel); color: var(--shell-text); font-size: 13px; }
    .segment { display: flex; margin-top: 8px; padding: 3px; border-radius: var(--r-sm); background: var(--shell-weak); }
    .segment__item { flex: 1; border: 0; border-radius: var(--r-xs); padding: 7px 8px; background: transparent; color: var(--shell-text-2); cursor: pointer; font-size: 13px; transition: background .15s, color .15s; }
    .segment__item--active { background: var(--shell-panel); color: var(--shell-text); font-weight: 500; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
    /* 当前不生效的分段：置灰但**保留在原位**，让「哪一档才有它」看得见 */
    .segment--disabled { opacity: .45; }
    .segment--disabled .segment__item { cursor: not-allowed; }
    .switch { position: relative; display: inline-block; width: 39px; height: 24px; flex: none; }
    .switch input { position: absolute; width: 0; height: 0; opacity: 0; }
    /* 数据量滑杆：走过的一段填主色、剩下的留浅灰，填充比例由 --fill 逐帧更新。
       没有轨道底色以外的装饰——同滚动条那条口径，控件不该在版面上留常驻色块。 */
    /* ⚠️ 轨道画在 ::track 上、input 自身透明：这样元素高度可以放大到 26px 当**命中区**，
       而轨道仍是细的 8px。把渐变直接铺在 input 上的话，元素多高轨道就多粗，
       想要大手柄就只能连轨道一起变胖，或者留一条 8px 高的细缝去点——两头不讨好。 */
    .slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 26px; margin: 10px 0 0;
      background: transparent; outline: 0; cursor: pointer;
    }
    .slider::-webkit-slider-runnable-track {
      height: 8px; border-radius: var(--r-pill);
      background: linear-gradient(to right,
        var(--shell-brand) 0 var(--fill, 0%), var(--shell-weak) var(--fill, 0%) 100%);
    }
    .slider::-moz-range-track {
      height: 8px; border-radius: var(--r-pill);
      background: linear-gradient(to right,
        var(--shell-brand) 0 var(--fill, 0%), var(--shell-weak) var(--fill, 0%) 100%);
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      margin-top: -8px;   /* (轨道 8 − 手柄 24) / 2，把手柄压回轨道中线 */
      background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .32);
    }
    .slider::-moz-range-thumb {
      width: 24px; height: 24px; border: 0; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .32);
    }
    .slider__value {
      flex: none; padding: 3px 10px; border-radius: var(--r-xs);
      background: var(--shell-weak); color: var(--shell-text);
      font-size: var(--font-min); font-weight: 500; font-variant-numeric: tabular-nums;
    }
    .slider__ends { display: flex; justify-content: space-between; color: var(--shell-text-4); font-size: var(--font-min); }

    .switch__track { position: absolute; inset: 0; border-radius: var(--r-pill); background: var(--shell-divider-strong); cursor: pointer; transition: background .16s; }
    .switch__knob { position: absolute; top: 2.5px; left: 2.5px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: var(--shell-shadow); transition: left .16s; }
    .switch input:checked ~ .switch__track { background: var(--shell-brand); }
    .switch input:checked ~ .switch__track .switch__knob { left: 17.5px; }
    .code-block { margin: 0; overflow: auto; border-radius: var(--r-md); padding: 14px 16px; background: var(--shell-bg); color: var(--shell-text); font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .logic-note { margin-top: 16px; color: var(--shell-text-2); font-size: 13px; line-height: 18px; }
    /* 主按钮用主色实心黑 —— 整面唯一的重色块，落在「恢复默认配置」这个唯一的动作上 */
    .button { width: 100%; margin-top: 16px; border: 0; border-radius: var(--r-pill); padding: 11px; background: var(--shell-brand); color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .18s; }
    .button:hover { opacity: .85; }

    /* 详情页三栏（导航 260 + 舞台 + 参数 320）在窄屏挤不下：演示外壳自己就有 320px 下限，
       低于这个宽度左栏先让位，回到「面包屑 + 键盘 ←/→」的老路径，键盘那条任何宽度都还在。 */
    @media (max-width: 1180px) {
      .workspace--detail .sidebar { display: none; }
      .workspace--detail .main { margin-left: 0; }
    }
    @media (max-width: 900px) {
      .topnav { display: none; }
      .detail { grid-template-columns: minmax(0, 1fr) 280px; }
      .gallery { padding-right: 16px; padding-left: 16px; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .sidebar {
        position: static; inset: auto; width: auto;
        border-bottom: 1px solid var(--shell-divider);
      }
      .sidebar__hint { display: none; }
      .search { padding-top: 12px; }
      /* 横向排布下第三级排不开：只留分类胶囊，换图回到画廊卡片那条路 */
      .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; }
      .nav-family, .nav-examples { display: none; }
      .nav-item { flex: none; width: auto; }
      .main { margin-left: 0; }
      .detail { grid-template-columns: 1fr; }
      .settings {
        position: static; height: auto;
        border-left: 0; border-top: 1px solid var(--shell-divider);
      }
      .page-head { align-items: flex-start; flex-direction: column; margin-bottom: 24px; }
      .detail__main { padding: 16px; }
      .stage__canvas { padding: 16px 0 calc(16px + var(--stage-bar-h)); }
      .stage__surface { min-width: 0; width: 100%; resize: vertical; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#all" aria-label="Vis Lab 首页">
      <span class="brand__copy">
        <span class="brand__name"><span>Vis</span><span class="brand__name-accent">Lab</span></span>
        <span class="brand__sub">可视化组件库</span>
      </span>
    </a>
    <nav class="topnav" aria-label="主导航">
      <a class="topnav__item topnav__item--active" href="#all">图表示例</a>
      <a class="topnav__item" href="./specs/axes.md">设计规范</a>
      <a class="topnav__item" href="./WORKFLOW.md">工作流</a>
    </nav>
  </header>

  <div class="workspace" id="workspace">
    <aside class="sidebar">
      <!-- 无抬头、无计数：顶栏已经写着「Vis Lab / 可视化组件库」，
           这里再来一个标题是复述；数量在导航里是噪音，总数画廊标题右侧就有。
           图表族名一律由 CHART_FAMILIES 派生并渲染进导航分节，不写死组件名。 -->
      <div class="search">
        <div class="search__wrap">
          <input class="search__input" id="search-input" type="search" placeholder="搜索示例" aria-label="搜索图表示例" />
          <button class="search__clear" id="search-clear" type="button">清除</button>
        </div>
      </div>
      <nav class="category-nav" id="category-nav" aria-label="图表分类"></nav>
      <p class="sidebar__hint"><kbd>←</kbd> <kbd>→</kbd> 换图，旋钮保持不变</p>
    </aside>
    <main class="main" id="main-content"></main>
  </div>

  <script type="importmap">
    { "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm" } }
  </script>
  <script type="module">
    import { mountExample } from './demos/registry.js';
    import { examplesFor, familiesFor, suggestedLegend, THEMES, capabilitiesOf, defaultDensityOf, defaultDensityCountOf, densitySliderOf, densityUnitOf, clampDensity, describeConfig, radarGridShapeOf, radarShapeOf, radarEditableOf, radarAxisLabelLayoutOf } from './demos/examples.js';
    import { sankeyPlaybackCopy } from './demos/sankey-presentation.js';
    import {
      applySankeyPlaybackViewport,
      runSankeyPlaybackUpdate,
      sankeyPlaybackMarkup as sharedSankeyPlaybackMarkup,
      sankeyPlaybackRangeTheme,
    } from './demos/sankey-playback.js';

    /* 示例定义、数据生成函数、主题与密度档位全部来自 demos/examples.js —— 与 playground 同一份数据源，
       加示例只加那一处。本页只负责「怎么展示」：画廊 + 详情页、单主题切换。 */
    const EXAMPLES = examplesFor('index');
    /* 分类导航按**图表族**分节（一个 L2 组件 = 一族），族内再列分类。
       族与族名都从 demos/examples.js 派生，接新组件时本页一行不改。 */
    const FAMILIES = familiesFor('index');
    const ALL = '全部示例';
    /* 移动端只有 375px 这一档，且**只给图表净宽**：高度不预设，交给组件自己的高度 token。
       chartWidth = 375 - 16 × 2 = 343；演示外壳的 padding / border 不得再吃掉这段净宽。
       只有一个取值，所以不做成旋钮——一个只能选它自己的下拉框是假的选择。
       将来真要多档（比如 390 / 430），把它改回数组并重新接一个 segment 即可。 */
    const MOBILE_VIEWPORT = { label: '375px', chartWidth: 343 };

    const state = {
      group: ALL,
      query: '',
      detail: null,
      theme: 'ths',
      platform: 'pc',
      mode: 'light',
      density: 4,            /* 连续档：本站的项数是一根滑杆，存的是**数**不是档位 id；
                                进详情时由 defaultDensityCountOf 换成该示例的默认值 */
      treemapColor: 'intensity',
      axisValue: false,       /* [RADAR-07] 轴标签数值，默认关；与交互无关 */
      radarGridShape: 'auto', /* [RADAR-03] 圆形 / 多边形网格；auto 保留示例默认 */
      radarShape: 'auto',    /* [RADAR-05] 直线 / 曲线轮廓；auto 保留示例默认 */
      radarEditable: 'off',  /* [RADAR-18] 编辑是可叠加能力，不是第三类雷达图 */
      seriesCount: 0,        /* index 专属示例控件：增减假数据 series，不进入图表能力或组件 cfg */
      ratingStyle: 'gradient', /* [RADAR-15] 分区雷达默认连续渐变，可切离散色带 */
      ratingBandCount: '6',  /* [RADAR-15] 分段档同时控制图内环带与底部说明，默认 6 段 */
      axisLabelLayout: 'auto', /* [RADAR-07/14] 常规横排、可调节环绕；点选后显式覆盖 */
      waterfallColor: 'primary',
      chordVariant: 'undirected', /* [CHORD-05/06] 无向一条带 / 有向每向一条 */
      chordLabelLayout: 'arc',    /* [CHORD-11] 环绕弧字 / 径向横排 */
      dataLabel: 'auto',      /* [LABEL-05] 开关的「开」= 按图表类型默认，不落进 cfg */
      labelLayout: 'off',     /* [PIE-12] 饼环显隐 + 形态合一：关 / 引线 / 扇区内，默认关 */
      labelAlign: 'anchor',   /* [PIE-13] 默认就近；仅引线档生效 */
      legend: 'right',        /* [PIE-09] 默认左右；切到引线时由 suggestedLegend 拨到上下 */
      legendSelect: 'multi',  /* [LEGEND-06][LEGEND-14] 图例点击语义：多选显隐 / 单选保留 / 强调，默认多选 */
      area: false,
      zoom: false,
      axisTitle: false,
      callout: true,   /* [CALLOUT-01] 示例声明了标注内容就默认显示，旋钮用来对比「没有标注时」 */
      animation: true, /* [MOTION-07] 与其他旋钮相反：默认开 */
      periodIndex: 0,
    };

    const main = document.getElementById('main-content');
    const workspace = document.getElementById('workspace');
    const categoryNav = document.getElementById('category-nav');
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    let charts = [];
    let chartCleanups = [];

    /* 仅 index 详情页消费的示例数据控件。范围声明跟示例夹具住在一起，但它不是
       CHART_CAPABILITIES，也不会作为 seriesCount 参数传进任何 L2 组件。 */
    function indexSeriesControlOf(example) {
      const range = example?.indexSeriesRange;
      if (!range) return null;
      const min = Math.max(1, Math.round(Number(range.min) || 1));
      const max = Math.max(min, Math.round(Number(range.max) || min));
      const value = Math.max(min, Math.min(max, Math.round(Number(range.default) || min)));
      return { label: '数据组数', hint: '系列数量', unit: '组数据', min, max, value };
    }

    function clampIndexSeriesCount(example, count) {
      const control = indexSeriesControlOf(example);
      if (!control) return 0;
      const value = Math.round(Number(count));
      return Number.isFinite(value) ? Math.max(control.min, Math.min(control.max, value)) : control.value;
    }

    const defaultIndexSeriesCountOf = (example) => indexSeriesControlOf(example)?.value ?? 0;

    function destroyCharts() {
      chartCleanups.splice(0).forEach((cleanup) => cleanup());
      charts.forEach((chart) => chart.destroy());
      charts = [];
    }

    /* 搜索的命中集**只按关键词收**，不掺分类筛选：导航要用它（分类是导航自己的一级，
       再叠一层就只剩当前分类了），画廊在它之上再叠分类。两者同源，搜索框因此
       既是画廊的筛子，也是导航的快速跳转。 */
    function matchedExamples() {
      const query = state.query.trim().toLowerCase();
      if (!query) return EXAMPLES;
      return EXAMPLES.filter((example) =>
        `${example.title}${example.description}${example.spec}`.toLowerCase().includes(query));
    }

    function filteredExamples() {
      return matchedExamples().filter((example) => state.group === ALL || example.group === state.group);
    }

    /* 分类图标：**按分类名取、取不到回落到族的图表类型**。
       只按名字取的话，改一个分类名图标就静默消失；回落到 chart 后最差也只是同族共用一枚，
       不会开天窗。图标一律 currentColor + fill:none，跟着字色走，不自带颜色。 */
    const ICON = (d, extra = '') =>
      `<svg class="nav-item__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra}</svg>`;
    const NAV_ICONS = {
      /* 柱：三根不等高的竖条 */
      '柱状图': ICON('<path d="M3.5 13V7M8 13V3.5M12.5 13V9.5"/>'),
      /* 堆叠：一根竖条被分成三段 */
      '堆叠图': ICON('<rect x="4" y="3" width="8" height="10" rx="1"/><path d="M4 6.5h8M4 9.5h8"/>'),
      /* 折线：一条折线 */
      '折线图': ICON('<path d="M2.5 11l3.5-4 3 2.5L13.5 4"/>'),
      /* 组合：两根柱 + 一条线 */
      '组合图': ICON('<path d="M3.5 13V8.5M12.5 13V6"/><path d="M2.5 5.5l4 2 3-2.5 4 1.5"/>'),
      /* 瀑布：三个**逐级悬空**的块拼成阶梯。
         ⚠️ 两条都是试出来的，别退回去：
         ① **不画三根等底的竖条**——那就是柱状图的图标，两族会撞；瀑布的辨识点是「柱不落在同一条底线上」。
         ② **不画虚线连接线**——语义上对，但 svg 继承了 stroke-linecap:round，
            1.5 长的 dash 在 16px 下被磨成一串灰点，整个图标糊成一团。
         悬空这一点由块的错位表达就够了，不需要连接线。 */
      '瀑布图': ICON('<rect x="2.8" y="9" width="3" height="4" rx=".6"/><rect x="6.5" y="6" width="3" height="4" rx=".6"/><rect x="10.2" y="3" width="3" height="4" rx=".6"/>'),
      /* 桑基：左右两侧节点 + 中间流带 */
      '桑基图': ICON('<path d="M2.5 3.5v3M2.5 9.5v3M13.5 5.5v5"/><path d="M2.5 5C6 5 7 8 13.5 8M2.5 11C6 11 7 8 13.5 8"/>'),
      /* 树图：一个矩形被切成大小不等的块 */
      '矩形树图': ICON('<rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M8.5 3v10M8.5 8h5"/>'),
      /* 雷达：正五边形 + 中心辐条 */
      '雷达图': ICON('<path d="M8 2.5l5.2 3.8-2 6.2H4.8l-2-6.2z"/><path d="M8 2.5v5.4M8 7.9l5.2-1.6M8 7.9l-5.2-1.6M8 7.9l3.2 4.6M8 7.9l-3.2 4.6" stroke-opacity=".45"/>'),
      /* 饼环：圆 + 一条切分线 */
      '饼图与环形图': ICON('<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8h5.5"/>'),
      /* 弦图：圆环 + 两条向心收束的弦 */
      '弦图': ICON('<circle cx="8" cy="8" r="5.5"/><path d="M3.6 5.1C7.2 8.4 8.8 8.4 12.4 5.1M4.4 11.4C7 8 9.6 7.2 13.2 9.2" stroke-opacity=".55"/>'),
      /* 族级回落 */
      cartesian: ICON('<path d="M3.5 13V7M8 13V3.5M12.5 13V9.5"/>'),
      sankey: ICON('<path d="M2.5 3.5v3M2.5 9.5v3M13.5 5.5v5"/><path d="M2.5 5C6 5 7 8 13.5 8M2.5 11C6 11 7 8 13.5 8"/>'),
      treemap: ICON('<rect x="2.5" y="3" width="11" height="10" rx="1"/><path d="M8.5 3v10M8.5 8h5"/>'),
      radar: ICON('<path d="M8 2.5l5.2 3.8-2 6.2H4.8l-2-6.2z"/>'),
      pie: ICON('<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8h5.5"/>'),
      waterfall: ICON('<rect x="2.8" y="9" width="3" height="4" rx=".6"/><rect x="6.5" y="6" width="3" height="4" rx=".6"/><rect x="10.2" y="3" width="3" height="4" rx=".6"/>'),
      chord: ICON('<circle cx="8" cy="8" r="5.5"/><path d="M3.6 5.1C7.2 8.4 8.8 8.4 12.4 5.1"/>'),
      /* 跨族入口：田字格 */
      __all: ICON('<rect x="2.5" y="2.5" width="5" height="5" rx="1"/><rect x="8.5" y="2.5" width="5" height="5" rx="1"/><rect x="2.5" y="8.5" width="5" height="5" rx="1"/><rect x="8.5" y="8.5" width="5" height="5" rx="1"/>'),
    };

    function renderNavigation() {
      const pool = matchedExamples();
      /* 分类的「选中」只在画廊里有意义（它筛的就是画廊）；进了详情页画廊没在显示，
         再把某个分类标成选中就是假信息——那时改标 --current：只说明当前这张图属于哪一节。 */
      const item = (group, chart) => {
        const active = !state.detail && state.group === group;
        const current = state.detail?.group === group;
        const icon = NAV_ICONS[group] ?? NAV_ICONS[chart] ?? '';
        return `<button class="nav-item${active ? ' nav-item--active' : ''}${current ? ' nav-item--current' : ''}"
          type="button" data-group="${group}">${icon}<span>${group}</span></button>`;
      };
      /* 示例是 <a href="#id">：走的还是既有的 hash 路由，故详情页内点它 = 直接换图，
         不经画廊；旋钮状态留在 state 里不动，换图后主题/明暗/动效原样保持。 */
      const leaf = (example) =>
        `<a class="nav-example${state.detail?.id === example.id ? ' nav-example--active' : ''}"
          href="#${example.id}" title="${example.title}"><span>${example.title}</span></a>`;
      /* 「全部示例」独立在最上，不归任何一族——它是跨族的入口 */
      categoryNav.innerHTML = item(ALL, '__all') + '<div class="nav-divider"></div>' + FAMILIES.map((family) => {
        /* 只保留当前命中集里还有示例的分类；整族筛空就整段不出 */
        const hits = family.groups
          .map((g) => [g, pool.filter((e) => e.group === g)])
          .filter(([, items]) => items.length);
        if (!hits.length) return '';
        const groups = hits
          .map(([g, items]) => item(g, family.chart) + `<div class="nav-examples">${items.map(leaf).join('')}</div>`)
          .join('');
        /* 族名恒出：它是「一个 L2 组件 = 一族」这条分层事实的可见处，
           哪怕族内只有一个分类，少了它就看不出雷达和饼是两个组件。 */
        return `<div class="nav-family"><span class="nav-family__title">${family.label}</span></div>${groups}`;
      }).join('');
      /* 20 个示例撑得比侧栏高，重画后当前那条常落在滚动区外——「我现在在哪」看不见，
         一步换图的好处就废了一半。`nearest` 只动最近的可滚动祖先（即本导航），不牵动整页。 */
      categoryNav.querySelector('.nav-example--active')?.scrollIntoView({ block: 'nearest' });
    }

    /* 配置装配与组件挂载都走 demos/ 共享模块：cfg 怎么拼、哪个旋钮对哪种图表生效，
       两个预览面用同一份实现（铁律3：面不自己拼装）。新图表类型只需在 registry 登记。 */
    function mountChart(host, example, overrides = {}) {
      const { instance, cfg } = mountExample(host, example, { ...state, ...overrides });
      charts.push(instance);
      return { instance, cfg };
    }

    function renderGallery() {
      const items = filteredExamples();
      const sections = state.group === ALL && !state.query
        ? [...new Set(items.map((item) => item.group))].map((group) => ({
          group,
          items: items.filter((item) => item.group === group),
        }))
        : [{ group: state.group === ALL ? '搜索结果' : state.group, items }];

      main.innerHTML = `<div class="gallery">
        <header class="page-head">
          <div>
            <h1>图表示例</h1>
            <p>按图表族浏览已验证能力。进入详情后，可编辑主题、终端、明暗、数据密度与缩放窗口等语义配置。</p>
          </div>
          <span class="page-head__meta">${items.length} 个结果</span>
        </header>
        ${items.length ? sections.map((section) => `<section class="gallery-section">
          <h2 class="section-title">${section.group}</h2>
          <div class="example-grid">${section.items.map((item) => `<a class="example-card" href="#${item.id}" data-id="${item.id}" data-chart="${item.chart}">
            <div class="example-card__preview" data-theme="ths" data-platform="pc" data-mode="light"><div class="chart-host"></div></div>
            <div class="example-card__body"><span class="example-card__title">${item.title}</span><span class="example-card__tag">${item.spec.split(' / ')[0]}</span></div>
          </a>`).join('')}</div>
        </section>`).join('') : '<div class="empty-state">没有匹配的图表示例</div>'}
      </div>`;

      main.querySelectorAll('.example-card').forEach((card) => {
        const example = EXAMPLES.find((item) => item.id === card.dataset.id);
        mountChart(card.querySelector('.chart-host'), example, {
          density: defaultDensityOf(example), theme: 'ths', platform: 'pc', area: false, zoom: false, axisTitle: false, callout: true,
          animation: true, compact: true,
        });
      });
    }

    /* disabled = 该旋钮当前不生效（如「标签对齐」在非引线档下）——置灰而不是隐藏：
       藏起来会让「这一档才有对齐可言」这件事变得不可见，用户只会以为功能没做。 */
    function segment(name, options, value, disabled = false) {
      return `<div class="segment${disabled ? ' segment--disabled' : ''}" data-segment="${name}"${disabled ? ' aria-disabled="true"' : ''}>${options.map(([id, label]) =>
        `<button class="segment__item${value === id ? ' segment__item--active' : ''}" type="button" data-value="${id}"${disabled ? ' disabled' : ''}>${label}</button>`).join('')}</div>`;
    }

    const playbackPeriodsOf = (example) => (example.playback?.periods ?? []).map((period) => (
      example.presentation?.(period, { theme: state.theme }) ?? period
    ));

    function clampPeriodIndex(example, index = state.periodIndex) {
      const periods = playbackPeriodsOf(example);
      return periods.length ? Math.max(0, Math.min(periods.length - 1, Math.round(index))) : 0;
    }

    function activeExample(example) {
      const periods = playbackPeriodsOf(example);
      let active = example;
      if (periods.length) {
        const period = periods[clampPeriodIndex(example)];
        active = { ...example, presentation: undefined, cfg: () => period };
      }
      const seriesControl = indexSeriesControlOf(active);
      if (!seriesControl) return active;
      const sourceCfg = active.cfg;
      const seriesCount = clampIndexSeriesCount(active, state.seriesCount);
      /* 第二参数只选示例假数据；返回给组件的仍是普通 cfg，没有 seriesCount 字段。 */
      return { ...active, cfg: (density) => sourceCfg(density, seriesCount) };
    }

    function playbackMarkup(example) {
      const periods = playbackPeriodsOf(example);
      if (!periods.length) return '<div class="chart-host"></div>';
      const copy = sankeyPlaybackCopy({ theme: state.theme });
      const currentIndex = clampPeriodIndex(example);
      return `<div class="chart-playback-layout">
        <div class="chart-host"></div>
        ${sharedSankeyPlaybackMarkup({
          periods,
          currentIndex,
          copy,
          playIconSrc: './assets/sankey/play.svg',
        })}
      </div>`;
    }

    /* 完整配置由 demos/examples.js 的同一个 buildConfig 生成，故这里展示的
       与真正传进组件的是同一份 cfg；数组及嵌套数据不折叠（铁律3：面不自己拼配置，
       也不自己猜配置的形状）。
       只有**不进 cfg** 的三项单列在前：主题 / 明暗写在容器的 data-* 上走 CSS 级联，
       机型视口只决定外壳尺寸、不传给组件。platform 由 describeConfig 从 cfg 带出。
       cfg 里没有的字段（如未开的 zoom、默认开的 animation）照实不显示 = 走组件默认。 */
    function currentConfig(example) {
      return {
        theme: state.theme,
        ...(state.platform === 'mobile' ? { viewport: MOBILE_VIEWPORT.label } : {}),
        mode: state.mode,
        ...describeConfig(activeExample(example), state),
      };
    }

    function mountPlayback(surface, example, chart) {
      const periods = playbackPeriodsOf(example);
      const copy = sankeyPlaybackCopy({ theme: state.theme });
      const range = surface.querySelector('.sankey-playback__range');
      const ticks = surface.querySelector('.sankey-playback__ticks');
      const toggle = surface.querySelector('.sankey-playback__primary');
      const output = surface.querySelector('.sankey-playback__period');
      const previous = surface.querySelector('.sankey-playback__step--prev');
      const next = surface.querySelector('.sankey-playback__step--next');
      range.dataset.theme = sankeyPlaybackRangeTheme(state.theme);
      range.dataset.mode = state.mode;
      range.dataset.platform = state.platform;
      let isPlaying = false;
      let disposed = false;
      let transitionTargetIndex = null;

      const renderPlaybackState = () => {
        if (disposed) return;
        const currentIndex = clampPeriodIndex(example);
        const currentPeriod = periods[currentIndex];
        range.value = `${currentIndex}`;
        output.value = currentPeriod.period;
        surface.dataset.period = currentPeriod.period;
        const stagePeriod = main.querySelector('[data-stage-period]');
        if (stagePeriod) stagePeriod.textContent = `${currentPeriod.period} · ${currentPeriod.statusLabel}`;
        toggle.classList.toggle('is-playing', isPlaying);
        toggle.setAttribute('aria-label', isPlaying ? copy.pause : copy.play);
        toggle.title = isPlaying ? copy.pauseTitle : copy.playTitle;
        previous.disabled = currentIndex <= 0;
        next.disabled = currentIndex >= periods.length - 1;
        ticks.querySelectorAll('[data-period-index]').forEach((tick) => {
          const isCurrent = Number(tick.dataset.periodIndex) === currentIndex;
          tick.classList.toggle('is-current', isCurrent);
          tick.setAttribute('aria-current', isCurrent ? 'true' : 'false');
        });
        const logicConfig = document.getElementById('logic-config');
        if (logicConfig) logicConfig.textContent = JSON.stringify(currentConfig(example), null, 2);
      };

      const stopPlayback = () => {
        isPlaying = false;
        chart.pause();
        renderPlaybackState();
      };

      const goToPeriod = async (targetIndex, animate = true) => {
        if (disposed) return false;
        const previousIndex = state.periodIndex;
        const target = clampPeriodIndex(example, targetIndex);
        transitionTargetIndex = target;
        state.periodIndex = target;
        renderPlaybackState();
        const completed = await runSankeyPlaybackUpdate(
          () => chart.update({
            ...periods[target],
            platform: state.platform,
          }, { animate }),
          {
            onError: (error) => console.error('主站桑基图播放更新失败', error),
            onFailure: () => {
              state.periodIndex = previousIndex;
              transitionTargetIndex = null;
              isPlaying = false;
              renderPlaybackState();
            },
          },
        );
        if (disposed) return false;
        if (completed) {
          transitionTargetIndex = null;
          renderPlaybackState();
        }
        return completed;
      };

      const playPeriods = async () => {
        if (isPlaying) {
          stopPlayback();
          return;
        }
        isPlaying = true;
        renderPlaybackState();
        try {
          if (transitionTargetIndex !== null) {
            const completed = await goToPeriod(transitionTargetIndex, true);
            if (!completed || !isPlaying || disposed) return;
          }
          if (state.periodIndex >= periods.length - 1) await goToPeriod(0, false);
          while (!disposed && isPlaying && state.periodIndex < periods.length - 1) {
            const completed = await goToPeriod(state.periodIndex + 1, true);
            if (!completed || !isPlaying || disposed) break;
            await new Promise((resolve) => setTimeout(resolve, 120));
          }
        } catch (error) {
          console.error('主站桑基图播放流程失败', error);
        } finally {
          isPlaying = false;
          renderPlaybackState();
        }
      };

      const onToggle = () => { void playPeriods(); };
      const onRange = () => {
        const requestedIndex = Number(range.value);
        stopPlayback();
        void goToPeriod(requestedIndex);
      };
      const onPrevious = () => {
        stopPlayback();
        void goToPeriod(state.periodIndex - 1);
      };
      const onNext = () => {
        stopPlayback();
        void goToPeriod(state.periodIndex + 1);
      };
      const onTick = (event) => {
        const tick = event.target.closest('[data-period-index]');
        if (!tick) return;
        stopPlayback();
        void goToPeriod(Number(tick.dataset.periodIndex));
      };

      toggle.addEventListener('click', onToggle);
      range.addEventListener('input', onRange);
      previous.addEventListener('click', onPrevious);
      next.addEventListener('click', onNext);
      ticks.addEventListener('click', onTick);
      renderPlaybackState();

      return () => {
        disposed = true;
        isPlaying = false;
        chart.pause();
        toggle.removeEventListener('click', onToggle);
        range.removeEventListener('input', onRange);
        previous.removeEventListener('click', onPrevious);
        next.removeEventListener('click', onNext);
        ticks.removeEventListener('click', onTick);
      };
    }

    function renderDetail() {
      const example = state.detail;
      state.periodIndex = clampPeriodIndex(example);
      const theme = THEMES.find((item) => item.id === state.theme);
      const hasPlayback = playbackPeriodsOf(example).length > 0;
      const currentPeriod = hasPlayback ? playbackPeriodsOf(example)[state.periodIndex] : null;
      const playbackCopy = sankeyPlaybackCopy({ theme: state.theme });
      const densitySlider = densitySliderOf(example);
      const densityLabel = `${state.density} ${densitySlider.unit}`;
      const seriesControl = indexSeriesControlOf(example);
      const seriesLabel = seriesControl
        ? `${clampIndexSeriesCount(example, state.seriesCount)} ${seriesControl.unit}`
        : '';
      const exampleSummary = example.summaryByTheme?.[state.theme] ?? example.summary;
      /* 只注初始宽度，高度不注——高度归 --size-chart-region-height（按主题分化）自然撑开 */
      const surfaceVariables = [
        ...(example.preferredWidth ? [`--chart-preferred-width:${example.preferredWidth}px`] : []),
        ...(state.platform === 'mobile'
          ? [`--mobile-chart-width:${MOBILE_VIEWPORT.chartWidth}px`]
          : []),
      ];
      const surfaceStyle = surfaceVariables.length
        ? ` style="${surfaceVariables.join(';')}"`
        : '';
      /* 旋钮按图表类型能力显隐——接入饼 / 环等无类目轴的图表时，缩放轴等开关自动不出现 */
      const caps = capabilitiesOf(example);
      const effectiveRadarGridShape = radarGridShapeOf(example, state.radarGridShape);
      const effectiveRadarShape = radarShapeOf(example, state.radarShape);
      const effectiveRadarEditable = radarEditableOf(example, state.radarEditable);
      const effectiveAxisLabelLayout = radarAxisLabelLayoutOf(example, state.axisLabelLayout, state.radarEditable);
      const areaAvailable = caps.area;

      main.innerHTML = `<div class="detail">
        <div class="detail__main">
          <header class="detail-head">
            <nav class="breadcrumb" aria-label="面包屑导航">
              <a class="breadcrumb__link" href="#all">图表示例</a>
              <span class="breadcrumb__separator" aria-hidden="true">/</span>
              <span class="breadcrumb__current" aria-current="page">${example.title}</span>
            </nav>
            <div class="detail-title-row">
              <div><h1>${example.title}</h1><p>${example.description}</p></div>
              <span class="spec-chip">${example.spec}</span>
            </div>
          </header>
          <section class="stage">
            <div class="stage__bar">
              <span class="stage__theme">${theme.label}</span>
              <span class="stage__meta">${currentPeriod ? `<span class="stage__period" data-stage-period>${currentPeriod.period} · ${currentPeriod.statusLabel}</span> · ` : ''}${state.platform === 'pc' ? 'PC' : `${playbackCopy.mobile} ${MOBILE_VIEWPORT.label}`} · ${state.mode === 'light' ? playbackCopy.light : playbackCopy.dark} · ${caps.density ? `<span data-stage-density>${densityLabel}</span>` : (exampleSummary ?? densityLabel)}</span>
            </div>
            <div class="stage__canvas">
              <div class="stage__surface" data-chart="${example.chart}" data-theme="${state.theme}" data-platform="${state.platform}" data-mode="${state.mode}" data-playback="${hasPlayback}"${surfaceStyle}>
                ${playbackMarkup(example)}
              </div>
            </div>
          </section>
        </div>
        <aside class="settings" aria-label="示例配置">
          <div class="tab"><div class="tab__list">
            <button class="tab__item tab__item--active" type="button" role="tab" aria-selected="true" data-panel="settings-panel">参数<span class="tab__indicator"></span></button>
            <button class="tab__item" type="button" role="tab" aria-selected="false" data-panel="logic-panel">逻辑<span class="tab__indicator"></span></button>
          </div></div>
          <div class="settings__panel" id="settings-panel">
            <!-- 主题用分段而非下拉：只有三个值，下拉要「点开 + 再点一次」，分段一次就切完；
                 换示例时 state.theme 不重置，所以选定的主题会跟着你一路看下去。 -->
            <div class="field"><div class="field__copy"><span class="field__label">主题</span><span class="field__hint">data-theme · 换示例后保持不变</span></div>${segment('theme', THEMES.map((item) => [item.id, item.label]), state.theme)}</div>
            <div class="field"><span class="field__label">终端</span><span class="field__hint">参与主题行为解析</span>${segment('platform', [['pc', 'PC'], ['mobile', '移动端']], state.platform)}</div>
            <div class="field"><span class="field__label">明暗</span><span class="field__hint">切换整套颜色 token</span>${segment('mode', [['light', '浅色'], ['dark', '深色']], state.mode)}</div>
            ${caps.density ? `<div class="field">
              <div class="field__row">
                <div class="field__copy"><span class="field__label">${densitySlider.label}</span><span class="field__hint">${densitySlider.hint}</span></div>
                <output class="slider__value" id="density-value">${densityLabel}</output>
              </div>
              <input class="slider" id="density-slider" type="range" step="1"
                min="${densitySlider.min}" max="${densitySlider.max}" value="${state.density}"
                aria-label="${densitySlider.label}" />
              <div class="slider__ends"><span>${densitySlider.min}</span><span>${densitySlider.max}</span></div>
            </div>` : ''}
            ${seriesControl ? `<div class="field">
              <div class="field__row">
                <div class="field__copy"><span class="field__label">${seriesControl.label}</span><span class="field__hint">${seriesControl.hint}</span></div>
                <output class="slider__value" id="series-value">${seriesLabel}</output>
              </div>
              <input class="slider" id="series-slider" type="range" step="1"
                min="${seriesControl.min}" max="${seriesControl.max}" value="${clampIndexSeriesCount(example, state.seriesCount)}"
                aria-label="${seriesControl.label}" />
              <div class="slider__ends"><span>${seriesControl.min}</span><span>${seriesControl.max}</span></div>
            </div>` : ''}
            ${caps.treemapColor && state.theme === 'ths' ? `<div class="field"><span class="field__label">颜色模式</span><span class="field__hint">THS · 程度五档 / 涨跌三档 / 涨跌无档位</span>${segment('treemapColor', [['intensity', '程度'], ['semantic-binned', '涨跌（分档）'], ['semantic-flat', '涨跌（不分档）']], state.treemapColor)}</div>` : ''}
            ${caps.radarGridShape ? `<div class="field"><span class="field__label">网格形态</span><span class="field__hint">RADAR-03 · 圆形或正多边形</span>${segment('radarGridShape', [['circle', '圆形'], ['polygon', '多边形']], effectiveRadarGridShape)}</div>` : ''}
            ${caps.radarShape ? `<div class="field"><span class="field__label">闭合轮廓</span><span class="field__hint">RADAR-05 · 直线或曲线</span>${segment('radarShape', [['straight', '直线'], ['curve', '曲线']], effectiveRadarShape)}</div>` : ''}
            ${caps.ratingStyle ? `<div class="field"><span class="field__label">分区</span><span class="field__hint">RADAR-15 · 默认连续渐变，可切离散色带</span>${segment('ratingStyle', [['gradient', '渐变'], ['bands', '分段']], state.ratingStyle)}</div>` : ''}
            ${caps.ratingBandCount && state.ratingStyle === 'bands' ? `<div class="field"><span class="field__label">分段数量</span><span class="field__hint">RADAR-15 · 同时控制雷达色带与底部说明</span>${segment('ratingBandCount', [['5', '5 段'], ['6', '6 段']], state.ratingBandCount)}</div>` : ''}
            ${caps.chordVariant ? `<div class="field"><span class="field__label">方向语义</span><span class="field__hint">CHORD-05/06 · 无向一条带或有向每向一条</span>${segment('chordVariant', [['undirected', '无向'], ['directed', '有向']], state.chordVariant)}</div>` : ''}
            ${caps.chordLabelLayout ? `<div class="field"><span class="field__label">实体标签排列</span><span class="field__hint">CHORD-11 · 沿弧环绕或径向横排</span>${segment('chordLabelLayout', [['arc', '环绕'], ['horizontal', '横排']], state.chordLabelLayout)}</div>` : ''}
            ${caps.axisLabelLayout ? `<div class="field"><span class="field__label">维度标签排列</span><span class="field__hint">RADAR-07/14 · 横排或沿外围圆弧环绕</span>${segment('axisLabelLayout', [['horizontal', '横排'], ['arc', '环绕']], effectiveAxisLabelLayout)}</div>` : ''}
            ${caps.radarEditable ? `<div class="field"><span class="field__label">可调节能力</span><span class="field__hint">RADAR-18 · 开启后使用单系列径向手柄</span>${segment('radarEditable', [['off', '关'], ['on', '开']], effectiveRadarEditable ? 'on' : 'off')}</div>` : ''}
            ${caps.axisValue && !effectiveRadarEditable && effectiveAxisLabelLayout === 'horizontal' ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">轴标签数值</span><span class="field__hint">RADAR-07 · 名称下方加一行数值；不影响 hover</span></div><label class="switch" aria-label="轴标签数值"><input id="axis-value-switch" type="checkbox"${state.axisValue ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            ${caps.waterfallColor ? `<div class="field"><span class="field__label">瀑布颜色</span><span class="field__hint">WATERFALL-10 · 统一主色 / 涨跌语义色</span>${segment('waterfallColor', [['primary', '主色'], ['semantic', '语义色']], state.waterfallColor)}</div>` : ''}
            ${caps.dataLabel ? `<div class="field"><span class="field__label">数据标签</span><span class="field__hint">LABEL-05 · 默认 = 各图表自己的规则；强开 = 分组柱 / 堆叠也画</span>${segment('dataLabel', [['auto', '默认'], ['on', '强开']], state.dataLabel)}</div>` : ''}
            ${caps.labelLayout ? `<div class="field"><span class="field__label">标签形态</span><span class="field__hint">PIE-12 · 引线与标签强绑定，故显隐与形态是同一个选择</span>${segment('labelLayout', [['off', '关'], ['outside', '引线'], ['inside', '扇区内']], state.labelLayout)}</div>` : ''}
            ${caps.labelAlign ? `<div class="field"><span class="field__label">标签对齐</span><span class="field__hint">PIE-13 · 仅引线档生效</span>${segment('labelAlign', [['anchor', '就近'], ['column', '成列'], ['edge', '贴边']], state.labelAlign, state.labelLayout !== 'outside')}</div>` : ''}
            ${caps.legend ? `<div class="field"><span class="field__label">图例布局</span><span class="field__hint">PIE-09 · 切到引线时默认拨到上下，可改回</span>${segment('legend', [['right', '左右'], ['bottom', '上下']], state.legend)}</div>` : ''}
            ${caps.legendSelect ? `<div class="field"><span class="field__label">图例点击</span><span class="field__hint">LEGEND-06/14 · 前两档改数据构成，强调档不改、只压不透明度</span>${segment('legendSelect', [['multi', '多选'], ['single', '单选'], ['focus', '强调']], state.legendSelect)}</div>` : ''}
            ${caps.zoom ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">缩放轴</span><span class="field__hint">DATAZOOM-01..07 · 初始后 65%</span></div><label class="switch" aria-label="缩放轴"><input id="zoom-switch" type="checkbox"${state.zoom ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            ${caps.axisTitle ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">轴标题</span><span class="field__hint">AXISTITLE-01..06 · 默认不显示</span></div><label class="switch" aria-label="轴标题"><input id="axis-title-switch" type="checkbox"${state.axisTitle ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            ${caps.callout ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">标注</span><span class="field__hint">CALLOUT-01..15 · 环 + 曲线引线 + 说明文字，位置自动避让</span></div><label class="switch" aria-label="标注"><input id="callout-switch" type="checkbox"${state.callout ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            ${caps.animation ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">入场动效</span><span class="field__hint">MOTION-01..07 · 默认开 · 仅首次挂载</span></div><label class="switch" aria-label="入场动效"><input id="animation-switch" type="checkbox"${state.animation ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            ${areaAvailable ? `<div class="field"><div class="field__row"><div class="field__copy"><span class="field__label">主线渐变面积</span><span class="field__hint">非堆叠折线语义配置</span></div><label class="switch" aria-label="主线渐变面积"><input id="area-switch" type="checkbox"${state.area ? ' checked' : ''}><span class="switch__track"><span class="switch__knob"></span></span></label></div></div>` : ''}
            <button class="button" id="reset-button" type="button">恢复默认配置</button>
          </div>
          <div class="settings__panel" id="logic-panel" hidden>
            <pre class="code-block" id="logic-config">${JSON.stringify(currentConfig(example), null, 2)}</pre>
            <p class="logic-note">${example.logicNote ?? '缩放窗口通过语义参数进入 L2；主题同时控制值 token、behavior 与恒开水印。'}</p>
          </div>
        </aside>
      </div>`;

      const surface = main.querySelector('.stage__surface');
      const stageHost = surface.querySelector('.chart-host');
      const playbackViewport = hasPlayback
        ? example.playback?.viewport?.[state.platform]
        : null;
      if (playbackViewport) {
        applySankeyPlaybackViewport(
          stageHost.closest('.chart-playback-layout'),
          surface,
          playbackViewport,
          '--chart-playback-chart-height',
        );
        stageHost.addEventListener('dv:sankey-layout', (event) => {
          const legendHeight = Number(event.detail?.legendReservedHeight);
          if (!Number.isFinite(legendHeight) || legendHeight <= 0) return;
          stageHost.closest('.chart-playback-layout')?.style.setProperty(
            '--chart-playback-chart-height',
            `${playbackViewport.canvasHeight + legendHeight}px`,
          );
        });
      }
      const { instance } = mountChart(stageHost, activeExample(example));
      if (hasPlayback) chartCleanups.push(mountPlayback(main.querySelector('.stage__surface'), example, instance));
      /* 外壳默认「高度由图表撑开」，用户一旦从右下角拖动就切成「容器说了算」——
         host 转 height:100%，组件的 ResizeObserver 接手重排。与 playground 的卡片同一套。
         判定用右下 18px 热区：resize 手柄本身不派发独立事件，只能靠这个位置推断。 */
      surface.addEventListener('pointerdown', (event) => {
        const rect = surface.getBoundingClientRect();
        if (rect.right - event.clientX <= 18 && rect.bottom - event.clientY <= 18) surface.classList.add('is-resized');
      });
      wireDetail();
    }

    /* 动一个旋钮会把 .detail 整块重建（旋钮之间会互相改显隐与置灰，局部更新反而更难说清），
       于是两个滚动容器的 scrollTop 双双归零——面板底部那几个旋钮点一下就被弹回顶部，
       连点两个就得重新滚两次。这里跨重建把位置接回去。
       ⚠️ 只有 rerenderDetail 该保留：换示例走的是 render()，那时回到顶部才是对的。 */
    function rerenderDetail() {
      const keep = ['.settings', '.detail__main']
        .map((sel) => [sel, main.querySelector(sel)?.scrollTop ?? 0]);
      destroyCharts();
      renderDetail();
      keep.forEach(([sel, top]) => {
        const el = main.querySelector(sel);
        /* 重建后内容可能变矮（某个旋钮档位少了一栏），浏览器会自行夹到可滚范围内 */
        if (el && top) el.scrollTop = top;
      });
    }

    /* 滑杆专用：**只换图表，不重建参数面板**。
       ① 整页重建会在拖动途中把 <input type="range"> 换成新节点，指针当场脱手；
       ② 十来个旋钮每帧重排也没必要。读数与填充条同步走，重绘合并到下一帧。
       动效恒关：这不是「入场」，拖一格重播一次生长会看得人眼晕，
       「入场动效」那个旋钮管的是首次挂载，两者不是一回事。 */
    let detailSliderFrame = 0;
    function remountDetailFromSlider(example) {
      cancelAnimationFrame(detailSliderFrame);
      detailSliderFrame = requestAnimationFrame(() => {
        const host = main.querySelector('.stage__surface .chart-host');
        if (!host) return;
        destroyCharts();
        host.innerHTML = '';
        mountChart(host, activeExample(example), { animation: false });
        const logicConfig = document.getElementById('logic-config');
        if (logicConfig) logicConfig.textContent = JSON.stringify(currentConfig(example), null, 2);
      });
    }

    function applyDensity(value) {
      const example = state.detail;
      state.density = clampDensity(example, value);
      const slider = main.querySelector('#density-slider');
      const readout = main.querySelector('#density-value');
      const unit = densityUnitOf(example);
      if (readout) readout.textContent = `${state.density} ${unit}`;
      if (slider) {
        const span = Number(slider.max) - Number(slider.min);
        const ratio = span > 0 ? (state.density - Number(slider.min)) / span : 0;
        slider.style.setProperty('--fill', `${ratio * 100}%`);
      }
      const stageDensity = main.querySelector('[data-stage-density]');
      if (stageDensity) stageDensity.textContent = `${state.density} ${unit}`;

      remountDetailFromSlider(example);
    }

    function applySeriesCount(value) {
      const example = state.detail;
      const control = indexSeriesControlOf(example);
      if (!control) return;
      state.seriesCount = clampIndexSeriesCount(example, value);
      const slider = main.querySelector('#series-slider');
      const readout = main.querySelector('#series-value');
      if (readout) readout.textContent = `${state.seriesCount} ${control.unit}`;
      if (slider) {
        const span = Number(slider.max) - Number(slider.min);
        const ratio = span > 0 ? (state.seriesCount - Number(slider.min)) / span : 0;
        slider.style.setProperty('--fill', `${ratio * 100}%`);
      }
      remountDetailFromSlider(example);
    }

    function wireDetail() {
      const densitySlider = document.getElementById('density-slider');
      if (densitySlider) {
        densitySlider.addEventListener('input', (event) => applyDensity(Number(event.target.value)));
        applyDensity(state.density);   /* 首屏把填充条对上当前值 */
      }
      const seriesSlider = document.getElementById('series-slider');
      if (seriesSlider) {
        seriesSlider.addEventListener('input', (event) => applySeriesCount(Number(event.target.value)));
        applySeriesCount(state.seriesCount);
      }
      document.getElementById('zoom-switch')?.addEventListener('change', (event) => {
        state.zoom = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('area-switch')?.addEventListener('change', (event) => {
        state.area = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('axis-title-switch')?.addEventListener('change', (event) => {
        state.axisTitle = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('callout-switch')?.addEventListener('change', (event) => {
        state.callout = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('animation-switch')?.addEventListener('change', (event) => {
        state.animation = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('axis-value-switch')?.addEventListener('change', (event) => {
        state.axisValue = event.target.checked;
        rerenderDetail();
      });
      document.getElementById('reset-button').addEventListener('click', () => {
        Object.assign(state, {
          theme: 'ths', platform: 'pc', mode: 'light', density: defaultDensityCountOf(state.detail),
          dataLabel: 'auto', labelLayout: 'off', labelAlign: 'anchor', legend: 'right',
          legendSelect: 'multi',
          treemapColor: 'intensity', axisValue: false,
          radarGridShape: 'auto', radarShape: 'auto', radarEditable: 'off', seriesCount: defaultIndexSeriesCountOf(state.detail), ratingStyle: 'gradient', ratingBandCount: '6',
          axisLabelLayout: 'auto', waterfallColor: 'primary',
          chordVariant: 'undirected', chordLabelLayout: 'arc',
          area: false, zoom: false, axisTitle: false, callout: true, animation: true, periodIndex: 0,
        });
        rerenderDetail();
      });
      main.querySelectorAll('[data-segment]').forEach((control) => {
        control.addEventListener('click', (event) => {
          const button = event.target.closest('button');
          if (!button || button.disabled) return;
          const key = control.dataset.segment;
          state[key] = button.dataset.value;
          /* [PIE-09][PIE-12] 切标签形态时把图例方位拨到该形态的建议默认值——
             只改**默认**，用户随后仍可手动改回（映射在 demos/examples.js，两个面共用）。 */
          if (key === 'labelLayout') state.legend = suggestedLegend(state.labelLayout);
          rerenderDetail();
        });
      });
      main.querySelectorAll('.tab__item').forEach((tab) => {
        tab.addEventListener('click', () => {
          main.querySelectorAll('.tab__item').forEach((item) => {
            const active = item === tab;
            item.classList.toggle('tab__item--active', active);
            item.setAttribute('aria-selected', String(active));
          });
          ['settings-panel', 'logic-panel'].forEach((id) => {
            document.getElementById(id).hidden = id !== tab.dataset.panel;
          });
        });
      });
    }

    function render() {
      destroyCharts();
      workspace.classList.toggle('workspace--detail', Boolean(state.detail));
      renderNavigation();
      if (state.detail) renderDetail();
      else renderGallery();
    }

    categoryNav.addEventListener('click', (event) => {
      const button = event.target.closest('[data-group]');
      if (!button) return;
      state.group = button.dataset.group;
      state.detail = null;
      window.history.pushState({}, '', '#all');
      render();
    });
    /* 详情页里搜索**只收窄左侧导航**：不把人踢回画廊，也不逐个按键重挂当前图表
       （renderDetail 会 destroy + 重建，那样打字就是一串闪烁）。画廊里才整页重画。 */
    function applyQuery(value) {
      state.query = value;
      searchClear.classList.toggle('is-visible', Boolean(state.query));
      if (state.detail) renderNavigation();
      else render();
    }
    searchInput.addEventListener('input', (event) => applyQuery(event.target.value));
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      applyQuery('');
    });

    /* [快速切换] ←/→ 在当前命中集里前后跳一张。窄屏左栏让位后这条仍在，是唯一不依赖布局的路径。
       输入框内、带修饰键时一律不接管，免得抢走搜索框与浏览器自身的快捷键。 */
    window.addEventListener('keydown', (event) => {
      if (!state.detail || event.metaKey || event.ctrlKey || event.altKey) return;
      const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      const target = event.target;
      if (target.isContentEditable || ['INPUT', 'SELECT', 'TEXTAREA'].includes(target.tagName)) return;
      const pool = matchedExamples();
      const index = pool.findIndex((example) => example.id === state.detail.id);
      if (index < 0) return;
      event.preventDefault();
      window.location.hash = `#${pool[(index + step + pool.length) % pool.length].id}`;
    });

    function syncRoute() {
      const id = window.location.hash.slice(1);
      const nextDetail = EXAMPLES.find((example) => example.id === id) || null;
      if ((state.detail?.id || null) === (nextDetail?.id || null)) return;
      state.detail = nextDetail;
      state.density = defaultDensityCountOf(nextDetail);
      state.seriesCount = defaultIndexSeriesCountOf(nextDetail);
      render();
    }

    window.addEventListener('popstate', syncRoute);
    window.addEventListener('hashchange', syncRoute);
    state.detail = EXAMPLES.find((example) => example.id === window.location.hash.slice(1)) || null;
    state.density = defaultDensityCountOf(state.detail);
    state.seriesCount = defaultIndexSeriesCountOf(state.detail);
    render();
  </script>
</body>
</html>
