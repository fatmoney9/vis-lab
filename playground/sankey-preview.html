<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SankeyChart · 独立预览</title>
  <link rel="stylesheet" href="../tokens/tokens.css" />
  <link rel="stylesheet" href="../charts/styles.css" />
  <link rel="stylesheet" href="../demos/sankey-playback.css" />
  <style>
    /* 与 cartesian-preview.html 保持一致：这里只放 Playground 外壳样式，
       桑基图生产样式由 charts/styles.css 的 .dv-sankey 命名空间提供。 */
    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: var(--spacing-0);
      background: var(--color-background-weak);
      color: var(--color-text-primary);
      font-family: var(--font-family-cn);
    }

    .sankey-preview {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacing-24);
      padding: var(--spacing-24);
    }

    .sankey-preview__head {
      display: grid;
      gap: var(--spacing-8);
    }

    .sankey-preview__head h1,
    .sankey-preview__head p {
      margin: var(--spacing-0);
    }

    .sankey-preview__head h1 {
      font-size: var(--font-size-extra-large);
      line-height: var(--line-height-extra-large);
      font-weight: var(--font-weight-medium);
    }

    .sankey-preview__head p {
      color: var(--color-text-secondary);
      font-size: var(--font-size-extra-small);
      line-height: var(--line-height-small);
    }

    .sankey-preview__eyebrow {
      color: var(--color-text-tertiary);
      font-size: var(--font-size-xxs);
      line-height: var(--line-height-super-small);
    }

    .sankey-preview__section {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacing-16);
      min-width: 0;
    }

    .sankey-preview__section-head {
      display: grid;
      gap: var(--spacing-4);
    }

    .sankey-preview__section-title,
    .sankey-preview__section-description {
      margin: var(--spacing-0);
    }

    .sankey-preview__section-title {
      font-size: var(--font-size-large);
      line-height: var(--line-height-large);
      font-weight: var(--font-weight-medium);
    }

    .sankey-preview__section-description {
      color: var(--color-text-secondary);
      font-size: var(--font-size-extra-small);
      line-height: var(--line-height-small);
    }

    .sankey-preview__card {
      min-width: 0;
      padding: var(--spacing-24);
      border: var(--size-grid-line) solid var(--color-visualization-divider);
      border-radius: var(--radius-10);
      color: var(--color-text-primary);
      font-family: var(--font-family-cn);
    }

    .sankey-preview__card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-12);
      margin-bottom: var(--spacing-16);
    }

    .sankey-preview__card-title {
      margin: var(--spacing-0);
      font-size: var(--font-size-medium);
      line-height: var(--line-height-medium);
      font-weight: var(--font-weight-medium);
    }

    .sankey-preview__card-meta {
      color: var(--color-text-tertiary);
      font-size: var(--font-size-xxs);
      line-height: var(--line-height-super-small);
    }

    .sankey-preview__host {
      width: 100%;
      height: auto;
      overflow-x: auto;
    }

    .sankey-preview__complex-layout {
      --sankey-demo-frame-width: 812px;
      --sankey-demo-header-height: 44px;
      --sankey-demo-chart-height: 243px;
      --sankey-playback-height: 88px;
      --sankey-demo-frame-height: calc(
        var(--sankey-demo-header-height)
        + var(--sankey-demo-chart-height)
        + var(--sankey-playback-height)
      );
      display: grid;
      grid-template-columns: minmax(0, var(--sankey-demo-frame-width)) calc(var(--spacing-24) * 12);
      gap: var(--spacing-24);
      align-items: start;
    }

    .sankey-preview__complex-content {
      display: grid;
      grid-template-rows:
        var(--sankey-demo-header-height)
        var(--sankey-demo-chart-height)
        var(--sankey-playback-height);
      width: min(100%, var(--sankey-demo-frame-width));
      max-width: var(--sankey-demo-frame-width);
      height: var(--sankey-demo-frame-height);
      min-width: 0;
      overflow: hidden;
    }

    .sankey-preview__complex-content > .sankey-preview__card-head {
      align-items: center;
      flex-direction: row;
      height: var(--sankey-demo-header-height);
      margin-bottom: var(--spacing-0);
    }

    .sankey-preview__complex-host {
      width: 100%;
      min-width: 0;
      height: var(--sankey-demo-chart-height);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x pan-y;
    }

    .sankey-preview__complex-host::-webkit-scrollbar {
      display: none;
    }

    /* 播放区视觉与 DOM 模板统一由 demos/sankey-playback.* 提供。 */
    /* [SANKEY-28] Ainvest playback: PC Figma Uv36h0PXzZG7ZhuHBHQ3qz / 110:2941
       经产品确认复用于移动端；只覆盖播放区，不改变桑基视口或图形计算。 */
    .sankey-preview__complex-card[data-theme="ainvest"] .sankey-preview__complex-layout {
      --sankey-playback-height: 110px;
    }


    .sankey-preview__complex-card[data-mode="dark"] {
      background: var(--color-grey-01);
      border-color: var(--color-background-weak);
    }

    .sankey-preview__complex-card[data-mode="dark"] .sankey-preview__config,
    .sankey-preview__complex-card[data-mode="dark"] .sankey-preview__config-summary,
    .sankey-preview__complex-card[data-mode="dark"] .sankey-preview__option-label {
      border-color: var(--color-background-weak);
    }

    .sankey-preview__config {
      display: grid;
      align-content: start;
      gap: var(--spacing-20);
      min-width: 0;
      padding-left: var(--spacing-24);
      border-left: var(--size-grid-line) solid var(--color-visualization-divider);
    }

    .sankey-preview__config-head,
    .sankey-preview__config-summary {
      display: grid;
      gap: var(--spacing-4);
    }

    .sankey-preview__config-title,
    .sankey-preview__config-description {
      margin: var(--spacing-0);
    }

    .sankey-preview__config-title {
      font-size: var(--font-size-medium);
      line-height: var(--line-height-medium);
      font-weight: var(--font-weight-medium);
    }

    .sankey-preview__config-description,
    .sankey-preview__config-summary {
      color: var(--color-text-tertiary);
      font-size: var(--font-size-xxs);
      line-height: var(--line-height-super-small);
    }

    .sankey-preview__config-fieldset {
      display: grid;
      gap: var(--spacing-8);
      min-width: 0;
      margin: var(--spacing-0);
      padding: var(--spacing-0);
      border: var(--spacing-0);
    }

    .sankey-preview__config-legend {
      padding: var(--spacing-0);
      color: var(--color-text-secondary);
      font-size: var(--font-size-extra-small);
      line-height: var(--line-height-small);
    }

    .sankey-preview__options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--spacing-6);
    }

    .sankey-preview__options--two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .sankey-preview__option {
      position: relative;
      min-width: 0;
      cursor: pointer;
    }

    .sankey-preview__option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .sankey-preview__option-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(var(--spacing-20) * 2);
      padding: var(--spacing-8) var(--spacing-6);
      overflow: hidden;
      border: var(--size-grid-line) solid var(--color-visualization-divider);
      border-radius: var(--radius-4);
      color: var(--color-text-secondary);
      font-size: var(--font-size-extra-small);
      line-height: var(--line-height-small);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sankey-preview__option input:checked + .sankey-preview__option-label {
      border-color: var(--color-text-primary);
      background: var(--color-background-weak);
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
    }

    .sankey-preview__option input:focus-visible + .sankey-preview__option-label {
      outline: var(--size-grid-line) solid var(--color-text-primary);
      outline-offset: var(--spacing-2);
    }

    .sankey-preview__config-summary {
      padding-top: var(--spacing-16);
      border-top: var(--size-grid-line) solid var(--color-visualization-divider);
    }

    /* PC 不复用移动端横版验收外框：图表按推荐总高完整展开，配置移到下方。 */
    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__complex-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__complex-content {
      grid-template-rows:
        var(--sankey-demo-header-height)
        auto
        var(--sankey-playback-height);
      width: 100%;
      max-width: none;
      height: auto;
      overflow: visible;
    }

    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__complex-host {
      height: auto;
      min-height: 424px;
      overflow-y: visible;
    }

    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__config {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding-top: var(--spacing-24);
      padding-left: var(--spacing-0);
      border-top: var(--size-grid-line) solid var(--color-visualization-divider);
      border-left: var(--spacing-0);
    }

    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__config-head,
    .sankey-preview__complex-card[data-platform="pc"] .sankey-preview__config-summary {
      grid-column: 1 / -1;
    }

    @media (max-width: 900px) {
      .sankey-preview__complex-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .sankey-preview__config {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding-top: var(--spacing-24);
        padding-left: var(--spacing-0);
        border-top: var(--size-grid-line) solid var(--color-visualization-divider);
        border-left: var(--spacing-0);
      }

      .sankey-preview__config-head,
      .sankey-preview__config-summary {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 640px) {
      .sankey-preview {
        padding: var(--spacing-16);
      }

      .sankey-preview__card {
        padding: var(--spacing-16);
      }

      .sankey-preview__card-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .sankey-preview__config {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body data-theme="ths" data-platform="pc" data-mode="light">
  <main class="sankey-preview">
    <header class="sankey-preview__head">
      <p class="sankey-preview__eyebrow">Vis Lab · SankeyChart</p>
      <h1>资金流向桑基图</h1>
      <p>收入、支出、利润决定颜色；数值符号参与财务恒等式，终止分支停在真实阶段。</p>
    </header>

    <section class="sankey-preview__section" aria-labelledby="complex-title">
      <header class="sankey-preview__section-head">
        <h2 class="sankey-preview__section-title" id="complex-title">财报收支拆解</h2>
        <p class="sankey-preview__section-description">播放轴覆盖完整财报序列及亏损期间；负值保留方向与角色，只用绝对值计算节点高度和边宽。</p>
      </header>

      <article
        class="sankey-preview__card sankey-preview__complex-card"
        id="complex-card"
        data-theme="ths"
        data-platform="mobile"
        data-mode="light"
      >
        <div class="sankey-preview__complex-layout">
          <div class="sankey-preview__complex-content">
            <header class="sankey-preview__card-head">
              <h3 class="sankey-preview__card-title" id="complex-card-title">2025 一季报 · 盈利</h3>
              <span class="sankey-preview__card-meta" id="complex-meta">THS · 移动端 · Light</span>
            </header>
            <div class="sankey-preview__host sankey-preview__complex-host" id="complex-host"></div>
            <div id="complex-playback-mount"></div>
          </div>

          <aside class="sankey-preview__config" aria-labelledby="config-title">
            <header class="sankey-preview__config-head">
              <h3 class="sankey-preview__config-title" id="config-title">预览配置</h3>
              <p class="sankey-preview__config-description" id="config-description">选择后即时更新图表。</p>
            </header>

            <fieldset class="sankey-preview__config-fieldset">
              <legend class="sankey-preview__config-legend">主题</legend>
              <div class="sankey-preview__options">
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-theme" value="ths" checked />
                  <span class="sankey-preview__option-label">THS</span>
                </label>
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-theme" value="ifind" />
                  <span class="sankey-preview__option-label">iFinD</span>
                </label>
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-theme" value="ainvest" />
                  <span class="sankey-preview__option-label">Ainvest</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="sankey-preview__config-fieldset" id="complex-platform-fieldset">
              <legend class="sankey-preview__config-legend">平台</legend>
              <div class="sankey-preview__options sankey-preview__options--two">
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-platform" value="pc" />
                  <span class="sankey-preview__option-label">PC</span>
                </label>
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-platform" value="mobile" checked />
                  <span class="sankey-preview__option-label">移动端</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="sankey-preview__config-fieldset">
              <legend class="sankey-preview__config-legend">模式</legend>
              <div class="sankey-preview__options sankey-preview__options--two">
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-mode" value="light" checked />
                  <span class="sankey-preview__option-label">浅色</span>
                </label>
                <label class="sankey-preview__option">
                  <input type="radio" name="complex-mode" value="dark" />
                  <span class="sankey-preview__option-label">深色</span>
                </label>
              </div>
            </fieldset>

            <div class="sankey-preview__config-summary" aria-live="polite">
              <span id="complex-summary-count">15 个节点 · 14 条流向</span>
              <span id="complex-summary-rule">终止分支按实际阶段收口，主利润链继续向右</span>
              <span id="complex-summary-size">序列统一高度计算中</span>
            </div>
          </aside>
        </div>
      </article>
    </section>
  </main>

  <script type="importmap">
    { "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm" } }
  </script>
  <script type="module">
    import { SankeyChart } from '../charts/charts/sankey/index.js';
    import {
      resolveSankeySequenceViewport,
      withSharedSankeyScale,
    } from '../charts/charts/sankey/model.js';
    import {
      financialSankeyPresentation,
      sankeyPlaybackCopy,
    } from '../demos/sankey-presentation.js';
    import {
      sankeyPlaybackMarkup,
      sankeyPlaybackRangeTheme,
      sankeyPlaybackTicksMarkup,
    } from '../demos/sankey-playback.js';

    const node = (id, name, role, extra = {}) => ({ id, name, role, ...extra });
    const income = (id, name, extra = {}) => node(id, name, 'income', extra);
    const expense = (id, name, extra = {}) => node(id, name, 'expense', extra);
    const profit = (id, name, extra = {}) => node(id, name, 'profit', extra);
    const yi = (value) => value * 1e8;
    const LEGEND_LABELS = { income: '收入', expense: '支出', profit: '利润' };

    const PERIOD_NODES = [
        income('domestic', '国内政企业务', { stage: 0, order: 0 }),
        income('other-business', '其他业务', { stage: 0, order: 1 }),
        income('international', '国际业务', { stage: 0, order: 2 }),
        income('revenue', '营业收入', { stage: 1 }),
        expense('cost', '营业成本', { stage: 2, order: 0 }),
        profit('gross', '毛利', { stage: 2, order: 1 }),
        income('other-operating', '其他经营收益', { stage: 2, order: 2 }),
        expense('operating-expense', '费用及营业税', { stage: 3, order: 0 }),
        profit('operating-profit', '营业利润', { stage: 3, order: 1 }),
        income('non-operating', '营业外净收入', { stage: 3, order: 2 }),
        profit('total-profit', '利润总额', { stage: 4 }),
        profit('net-profit', '净利润', { stage: 5, order: 0 }),
        expense('income-tax', '所得税费用', { stage: 5, order: 1 }),
        profit('parent-profit', '归母净利润', { stage: 6, order: 0 }),
        expense('minority-interest', '少数股东权益', { stage: 6, order: 1 }),
    ];

    const makeQuarter = ({
      period,
      shortPeriod,
      sources,
      cost,
      operatingExpense,
      otherOperating,
      nonOperating,
      incomeTax,
      minorityInterest,
      statusLabel = '盈利',
    }) => {
      const [domestic, otherBusiness, international] = sources.map(yi);
      const revenue = domestic + otherBusiness + international;
      const costValue = yi(cost);
      const gross = revenue - costValue;
      const operatingExpenseValue = yi(operatingExpense);
      const grossToOperating = gross - operatingExpenseValue;
      const otherOperatingValue = yi(otherOperating);
      const operatingProfit = grossToOperating + otherOperatingValue;
      const nonOperatingValue = yi(nonOperating);
      const totalProfit = operatingProfit + nonOperatingValue;
      const incomeTaxValue = yi(incomeTax);
      const netProfit = totalProfit - incomeTaxValue;
      const minorityInterestValue = yi(minorityInterest);

      return {
        nodes: PERIOD_NODES,
        links: [
          { source: 'domestic', target: 'revenue', value: domestic },
          { source: 'other-business', target: 'revenue', value: otherBusiness },
          { source: 'international', target: 'revenue', value: international },
          { source: 'revenue', target: 'cost', value: costValue },
          {
            source: 'revenue',
            target: 'gross',
            value: gross,
            negativeSource: 'cost',
          },
          { source: 'gross', target: 'operating-expense', value: operatingExpenseValue },
          {
            source: 'gross',
            target: 'operating-profit',
            value: grossToOperating,
            negativeSource: 'operating-expense',
          },
          { source: 'other-operating', target: 'operating-profit', value: otherOperatingValue },
          { source: 'operating-profit', target: 'total-profit', value: operatingProfit },
          { source: 'non-operating', target: 'total-profit', value: nonOperatingValue },
          {
            source: 'total-profit',
            target: 'net-profit',
            value: netProfit,
            negativeSource: 'income-tax',
          },
          { source: 'total-profit', target: 'income-tax', value: incomeTaxValue },
          {
            source: 'net-profit',
            target: 'parent-profit',
            value: netProfit - minorityInterestValue,
            negativeSource: 'minority-interest',
          },
          {
            source: 'net-profit',
            target: 'minority-interest',
            value: minorityInterestValue,
          },
        ],
        legendLabels: LEGEND_LABELS,
        period,
        shortPeriod,
        statusLabel,
      };
    };

    const QUARTER_DATA = withSharedSankeyScale([
      ['2025 一季报', '25 Q1', [148, 55, 12], 188, 18, -0.8, 0.3, 0.8, 1.1],
      ['2025 半年报', '25 Q2', [162, 61, 14], 205, 20, -0.4, 0.5, 1.2, 1.4],
      ['2025 三季报', '25 Q3', [176, 67, 15], 222, 22, 0.2, 0.4, 1.5, 1.8],
      ['2025 年报', '25 Q4', [186, 71, 16], 295, 32, -3, 1, 1.7, 2, '亏损'],
      ['2026 一季报', '26 Q1', [190.71, 72.68, 16.46], 243.8, 24.4, -1.11, 0.015083, 0.945083, 1.73],
      ['2026 半年报', '26 Q2', [205, 78, 18], 260, 26, -0.4, 0.6, 1.4, 2.1],
      ['2026 三季报', '26 Q3', [218, 84, 20], 276, 28, 0.6, 0.9, 1.9, 2.5],
      ['2026 年报', '26 Q4', [236, 92, 22], 298, 31, 1.2, 1.1, 2.3, 3],
    ].map(([
      period,
      shortPeriod,
      sources,
      cost,
      operatingExpense,
      otherOperating,
      nonOperating,
      incomeTax,
      minorityInterest,
      statusLabel,
    ]) => makeQuarter({
      period,
      shortPeriod,
      sources,
      cost,
      operatingExpense,
      otherOperating,
      nonOperating,
      incomeTax,
      minorityInterest,
      statusLabel,
    })));

    const THEMES = [
      { id: 'ths', name: 'THS' },
      { id: 'ifind', name: 'iFinD' },
      { id: 'ainvest', name: 'Ainvest' },
    ];

    const SEQUENCE_VIEWPORTS = Object.fromEntries(['pc', 'mobile'].map((platform) => [
      platform,
      resolveSankeySequenceViewport(QUARTER_DATA, platform),
    ]));
    const complexLayout = document.querySelector('.sankey-preview__complex-layout');
    const applySequenceViewport = (platform) => {
      complexLayout.style.setProperty(
        '--sankey-demo-chart-height',
        `${SEQUENCE_VIEWPORTS[platform].totalHeight}px`,
      );
    };
    applySequenceViewport('mobile');

    document.getElementById('complex-playback-mount').outerHTML = sankeyPlaybackMarkup({
      periods: QUARTER_DATA,
      copy: sankeyPlaybackCopy({ theme: 'ths' }),
      playIconSrc: '../assets/sankey/play.svg',
      idPrefix: 'complex-playback',
    });

    const complexCard = document.getElementById('complex-card');
    const complexCardTitle = document.getElementById('complex-card-title');
    const complexMeta = document.getElementById('complex-meta');
    const configDescription = document.getElementById('config-description');
    const complexSummaryCount = document.getElementById('complex-summary-count');
    const complexSummaryRule = document.getElementById('complex-summary-rule');
    const complexSummarySize = document.getElementById('complex-summary-size');
    const complexPlayback = document.getElementById('complex-playback');
    const complexPlaybackRange = document.getElementById('complex-playback-range');
    const complexPlaybackTicks = document.getElementById('complex-playback-ticks');
    const complexPlaybackToggle = document.getElementById('complex-playback-toggle');
    const complexPlaybackPeriod = document.getElementById('complex-playback-period');
    const complexPlaybackPrev = document.getElementById('complex-playback-prev');
    const complexPlaybackNext = document.getElementById('complex-playback-next');
    const complexPlaybackPrevLabel = document.getElementById('complex-playback-prev-label');
    const complexPlaybackNextLabel = document.getElementById('complex-playback-next-label');
    const complexHost = document.getElementById('complex-host');
    complexHost.addEventListener('dv:sankey-layout', (event) => {
      const {
        legendReservedHeight,
        recommendedHeight,
        renderedHeight,
        renderedWidth,
      } = event.detail;
      const viewport = SEQUENCE_VIEWPORTS[complexCard.dataset.platform];
      if (viewport && Number.isFinite(legendReservedHeight)) {
        complexLayout.style.setProperty(
          '--sankey-demo-chart-height',
          `${viewport.canvasHeight + legendReservedHeight}px`,
        );
      }
      complexSummarySize.textContent = complexCard.dataset.theme === 'ainvest'
        ? [
          `Recommended ${Math.round(recommendedHeight)}px`,
          `Current ${Math.round(renderedHeight)}px`,
          `Plot width ${Math.round(renderedWidth)}px`,
        ].join(' · ')
        : [
          `推荐高 ${Math.round(recommendedHeight)}px`,
          `当前 ${Math.round(renderedHeight)}px`,
          `绘图区宽 ${Math.round(renderedWidth)}px`,
        ].join(' · ');
    });
    const complexChart = SankeyChart(complexHost, {
      ...QUARTER_DATA[0],
      platform: 'mobile',
    });
    let periodPosition = 0;
    let isPlaying = false;
    let transitionTargetIndex = null;
    const complexState = {
      theme: 'ths',
      platform: 'mobile',
      mode: 'light',
    };
    const themeNames = Object.fromEntries(THEMES.map((theme) => [theme.id, theme.name]));
    const platformNames = { pc: 'PC', mobile: '移动端' };
    const modeNames = { light: 'Light', dark: 'Dark' };

    const clampPeriod = (value) => Math.max(0, Math.min(QUARTER_DATA.length - 1, value));
    const displayQuarter = (quarter) => financialSankeyPresentation(quarter, {
      theme: complexState.theme,
    });
    const renderPlaybackTicks = () => {
      const displayedPeriods = QUARTER_DATA.map(displayQuarter);
      complexPlaybackTicks.innerHTML = sankeyPlaybackTicksMarkup(
        displayedPeriods,
        Math.round(clampPeriod(periodPosition)),
      );
    };

    const renderPlaybackState = () => {
      const displayQuarterIndex = Math.round(clampPeriod(periodPosition));
      const progress = displayQuarterIndex / (QUARTER_DATA.length - 1) * 100;
      const displayedQuarter = displayQuarter(QUARTER_DATA[displayQuarterIndex]);
      const copy = sankeyPlaybackCopy({ theme: complexState.theme });
      complexPlaybackRange.value = `${displayQuarterIndex}`;
      complexPlaybackRange.style.setProperty('--playback-progress', `${progress}%`);
      complexPlaybackPeriod.value = displayedQuarter.period;
      complexPlayback.setAttribute('aria-label', copy.timeline);
      complexPlaybackRange.setAttribute('aria-label', copy.progress);
      complexPlaybackToggle.classList.toggle('is-playing', isPlaying);
      complexPlaybackToggle.setAttribute(
        'aria-label',
        isPlaying ? copy.pause : copy.play,
      );
      complexPlaybackToggle.title = isPlaying ? copy.pauseTitle : copy.playTitle;
      complexPlaybackPrevLabel.textContent = copy.previous;
      complexPlaybackNextLabel.textContent = copy.next;
      complexPlaybackPrev.disabled = displayQuarterIndex <= 0;
      complexPlaybackNext.disabled = displayQuarterIndex >= QUARTER_DATA.length - 1;
      complexPlaybackTicks.querySelectorAll('[data-period-index]').forEach((tick) => {
        tick.classList.toggle(
          'is-current',
          Number(tick.dataset.periodIndex) === displayQuarterIndex,
        );
      });
      complexCardTitle.textContent = `${displayedQuarter.period} · ${displayedQuarter.statusLabel}`;
    };

    const stopPlayback = () => {
      isPlaying = false;
      complexChart.pause();
      renderPlaybackState();
    };

    const goToPeriod = async (targetIndex, animate = true) => {
      const target = Math.round(clampPeriod(targetIndex));
      transitionTargetIndex = target;
      periodPosition = target;
      renderPlaybackState();
      const completed = await complexChart.update({
        ...displayQuarter(QUARTER_DATA[target]),
        platform: complexState.platform,
      }, {
        animate,
      });
      if (completed) {
        transitionTargetIndex = null;
        renderPlaybackState();
      }
      return completed;
    };

    const playPeriods = async () => {
      if (isPlaying) {
        stopPlayback();
        return;
      }
      isPlaying = true;
      renderPlaybackState();
      if (transitionTargetIndex !== null) {
        const completed = await goToPeriod(transitionTargetIndex, true);
        if (!completed || !isPlaying) {
          isPlaying = false;
          renderPlaybackState();
          return;
        }
      }
      if (periodPosition >= QUARTER_DATA.length - 1) {
        await goToPeriod(0, false);
      }
      while (isPlaying && periodPosition < QUARTER_DATA.length - 1) {
        const completed = await goToPeriod(periodPosition + 1, true);
        if (!completed || !isPlaying) break;
        await new Promise((resolve) => setTimeout(resolve, 120));
      }
      isPlaying = false;
      renderPlaybackState();
    };

    const updateComplexPreview = () => {
      const scenario = displayQuarter(QUARTER_DATA[Math.round(clampPeriod(periodPosition))]);
      const isAinvest = complexState.theme === 'ainvest';
      const copy = sankeyPlaybackCopy({ theme: complexState.theme });
      const tokenTheme = complexState.theme === 'ifind' ? 'ifind-pc' : complexState.theme;
      const playbackTokenTheme = sankeyPlaybackRangeTheme(tokenTheme);
      configDescription.textContent = isAinvest
        ? 'Ainvest · English labels use the theme font; fitting rules remain unchanged.'
        : complexState.theme === 'ifind'
          ? complexState.platform === 'pc'
            ? 'iFinD · PC 使用 PC 静态图规范，播放滑块复用 THS 样式。'
            : 'iFinD · 移动端按移动端平台布局，播放滑块复用 THS 样式。'
          : '选择后即时更新图表。';
      complexCard.dataset.theme = tokenTheme;
      complexCard.dataset.platform = complexState.platform;
      complexCard.dataset.mode = complexState.mode;
      applySequenceViewport(complexState.platform);
      complexPlaybackRange.dataset.theme = playbackTokenTheme;
      complexPlaybackRange.dataset.platform = complexState.platform;
      complexPlaybackRange.dataset.mode = complexState.mode;
      complexCardTitle.textContent = `${scenario.period} · ${scenario.statusLabel}`;
      complexMeta.textContent = [
        themeNames[complexState.theme],
        isAinvest ? (complexState.platform === 'pc' ? 'PC' : copy.mobile) : platformNames[complexState.platform],
        modeNames[complexState.mode],
      ].join(' · ');
      complexSummaryCount.textContent = isAinvest
        ? `${scenario.nodes.length} nodes · ${scenario.links.length} flows`
        : `${scenario.nodes.length} 个节点 · ${scenario.links.length} 条流向`;
      complexSummaryRule.textContent = isAinvest
        ? scenario.statusLabel === 'Loss'
          ? 'Negative values keep their direction and semantic role colors'
          : 'Terminal branches stop at their actual stage'
        : scenario.statusLabel === '亏损'
          ? '负值不反转流向；角色色保持不变，负数文字使用正文色'
          : '终止分支按实际阶段收口，主利润链继续向右';
      renderPlaybackTicks();
      complexChart.update({
        ...scenario,
        platform: complexState.platform,
      });
      renderPlaybackState();
    };

    complexPlaybackToggle.addEventListener('click', playPeriods);
    complexPlaybackRange.addEventListener('input', () => {
      const requestedPosition = Math.round(clampPeriod(Number(complexPlaybackRange.value)));
      stopPlayback();
      goToPeriod(requestedPosition);
    });
    complexPlaybackPrev.addEventListener('click', () => {
      stopPlayback();
      goToPeriod(Math.max(0, periodPosition - 1));
    });
    complexPlaybackNext.addEventListener('click', () => {
      stopPlayback();
      goToPeriod(Math.min(QUARTER_DATA.length - 1, periodPosition + 1));
    });
    complexPlaybackTicks.addEventListener('click', (event) => {
      const tick = event.target.closest('[data-period-index]');
      if (!tick) return;
      stopPlayback();
      goToPeriod(Number(tick.dataset.periodIndex));
    });

    document.querySelectorAll('input[name^="complex-"]').forEach((input) => {
      input.addEventListener('change', () => {
        transitionTargetIndex = null;
        stopPlayback();
        const key = input.name.replace('complex-', '');
        complexState[key] = input.value;
        updateComplexPreview();
      });
    });
    renderPlaybackTicks();
    renderPlaybackState();
  </script>
</body>
</html>
