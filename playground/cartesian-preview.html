<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>L2 开发预览 · 直角坐标图（CartesianChart · 三主题 × 端 × 明暗）</title>
<style>
  /* 值 token 由 tokens/tokens.css 提供（按 data-theme / data-platform / data-mode 作用域）；
     系列色由 palette.js 取、CartesianChart 写成 --dv-series-i，预览无需任何色值替身。
     —— 本文件只做「预览外壳」的样式，图表内部一切颜色/字号仍走 token。 */
  :root {
    --shell-bg: #f4f5f7;
    --shell-panel: #ffffff;
    --shell-border: rgba(0, 0, 0, 0.08);
    --shell-border-soft: rgba(0, 0, 0, 0.05);
    --shell-text: rgba(0, 0, 0, 0.86);
    --shell-text-2: rgba(0, 0, 0, 0.56);
    --shell-text-3: rgba(0, 0, 0, 0.38);
    --shell-accent: #3366ff;
    --shell-accent-weak: rgba(51, 102, 255, 0.1);
    --card-light-bg: #ffffff;
    --card-dark-bg: #1a1b1e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--shell-bg); color: var(--shell-text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 三栏骨架：左分类 / 中画布 / 右配置 ───────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 248px;
    height: 100vh;
  }
  .pane { min-height: 0; display: flex; flex-direction: column; }
  .pane-left  { border-right: 1px solid var(--shell-border); background: var(--shell-panel); }
  .pane-right { border-left: 1px solid var(--shell-border); background: var(--shell-panel); }
  .pane-main  { background: var(--shell-bg); }

  /* ── 左栏：图表分类 ──────────────────────────────────────────────── */
  .brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--shell-border-soft); }
  .brand h1 { font-size: 14px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.2px; }
  .brand p { font-size: 11px; line-height: 16px; color: var(--shell-text-3); margin: 0; }

  .nav { padding: 8px 10px 20px; overflow-y: auto; flex: 1; }
  .nav-group-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--shell-text-3); padding: 14px 10px 6px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 0; background: transparent; font: inherit; color: var(--shell-text-2);
    padding: 8px 10px; border-radius: 7px; line-height: 18px; font-size: 13px;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: rgba(0, 0, 0, 0.035); color: var(--shell-text); }
  .nav-item.is-active { background: var(--shell-accent-weak); color: var(--shell-accent); font-weight: 600; }

  /* ── 中栏：画布头 + 三主题卡片 ──────────────────────────────────── */
  .canvas-head { padding: 22px 28px 14px; border-bottom: 1px solid var(--shell-border-soft); }
  .canvas-head h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .canvas-head p  { font-size: 12px; line-height: 18px; color: var(--shell-text-2); margin: 0; max-width: 760px; }

  .canvas-body {
    flex: 1; overflow: auto; padding: 20px 28px 36px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 18px;
  }

  /* 每个主题一张卡：卡背景跟随 明暗，图表内部字号/网格跟随 端。
     resize:both → 拖右下角自由改宽高；chart-mount flex:1 撑满，
     组件 observeResize 捕获宽/高两维变化并整体重排（GRID-03）。 */
  .theme-card {
    border-radius: 10px; border: 1px solid var(--shell-border-soft);
    display: flex; flex-direction: column;
    flex: none; /* 不参与列 flex 的主轴伸缩，否则 flex-shrink 会顶掉拖动出的高度 */
    width: 100%; height: 360px; min-width: 320px; min-height: 240px;
    resize: both; overflow: auto;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    background: var(--card-light-bg);
    transition: background .18s;
  }
  .theme-card[data-mode="dark"] { background: var(--card-dark-bg); border-color: rgba(255, 255, 255, 0.08); }

  .theme-card__bar {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 16px; border-bottom: 1px solid var(--shell-border-soft);
  }
  .theme-card[data-mode="dark"] .theme-card__bar { border-bottom-color: rgba(255, 255, 255, 0.08); }
  .theme-card__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .theme-card__name { font-size: 12px; font-weight: 600; color: var(--shell-text); }
  .theme-card[data-mode="dark"] .theme-card__name { color: rgba(255, 255, 255, 0.9); }
  .theme-card__meta { font-size: 11px; color: var(--shell-text-3); margin-left: auto; font-variant-numeric: tabular-nums; }
  .theme-card[data-mode="dark"] .theme-card__meta { color: rgba(255, 255, 255, 0.4); }

  .chart-mount { flex: 1; min-height: 0; padding: 8px 14px 14px; }
  .chart-host  { height: 100%; }

  /* ── 右栏：配置（端 / 明暗）────────────────────────────────────── */
  .config { padding: 20px 18px; overflow-y: auto; flex: 1; }
  .config h3 { font-size: 12px; font-weight: 600; margin: 0 0 18px; letter-spacing: 0.2px; }
  .field { margin-bottom: 22px; }
  .field-label { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .field-label b { font-size: 12px; font-weight: 600; color: var(--shell-text); }
  .field-label span { font-size: 11px; color: var(--shell-text-3); }

  .seg { display: flex; background: rgba(0, 0, 0, 0.04); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; cursor: pointer; border: 0; background: transparent; font: inherit; font-size: 12px;
    color: var(--shell-text-2); padding: 7px 8px; border-radius: 6px; line-height: 16px;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  .seg button:hover:not(.is-active) { color: var(--shell-text); }
  .seg button.is-active {
    background: var(--shell-panel); color: var(--shell-accent); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  }

  .config-note {
    font-size: 11px; line-height: 17px; color: var(--shell-text-3);
    border-top: 1px solid var(--shell-border-soft); padding-top: 16px; margin-top: 4px;
  }
  .config-note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px;
    background: rgba(0, 0, 0, 0.05); padding: 1px 4px; border-radius: 3px;
  }
</style>
<link rel="stylesheet" href="../tokens/tokens.css" />
<link rel="stylesheet" href="../charts/styles.css" />
</head>
<body>
<div class="app">
  <!-- 左：图表分类 -->
  <aside class="pane pane-left">
    <div class="brand">
      <h1>CartesianChart</h1>
      <p>直角坐标图 L2 预览 · 只传数据 + 语义配置</p>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- 中：当前分类 × 三主题 -->
  <main class="pane pane-main">
    <div class="canvas-head">
      <h2 id="cat-title">—</h2>
      <p id="cat-desc">—</p>
    </div>
    <div class="canvas-body" id="canvas"></div>
  </main>

  <!-- 右：端 / 明暗 -->
  <aside class="pane pane-right">
    <div class="config">
      <h3>显示配置</h3>

      <div class="field">
        <div class="field-label"><b>端</b><span>data-platform</span></div>
        <div class="seg" id="seg-platform">
          <button data-value="pc" class="is-active">PC</button>
          <button data-value="mobile">移动端</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><b>明暗</b><span>data-mode</span></div>
        <div class="seg" id="seg-mode">
          <button data-value="light" class="is-active">浅色</button>
          <button data-value="dark">深色</button>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><b>数据量</b><span>类目数</span></div>
        <div class="seg" id="seg-density">
          <button data-value="few" class="is-active">少 4</button>
          <button data-value="mid">中 16</button>
          <button data-value="many">多 36</button>
        </div>
      </div>

      <p class="config-note">
        端与明暗切换后三张卡片会整体重绘：端影响 <code>--font-size-axis</code> / 网格线粗细与轴的行为旋钮，
        明暗切换整套文本与网格色。左侧切分类换图形，三主题横向对比同一份数据。
        数据量对所有分类生效（类目数 4 / 16 / 36）：看柱容器收缩（BAR-03）、X 标签碰撞（AXIS-06）、
        折线数据点显隐分档（&gt;13 全隐）。
      </p>
    </div>
  </aside>
</div>

<script type="importmap">
  { "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm" } }
</script>
<script type="module">
  import { CartesianChart } from '../charts/charts/cartesian/index.js';

  const K = (arr) => arr.map((v) => (v == null ? null : v * 1000)); // ×1000 让 FORMAT-01 单位换算可见

  /* 数据按右侧「数据量」旋钮的类目数 n 生成（cfg 是 n 的函数，所有分类同一套 n）。
     wave 带相位 p：多系列各取不同相位得到不同形状 */
  const seq = (n) => Array.from({ length: n }, (_, i) => `${i + 1}`);
  const wave = (n, p = 0) => K(Array.from({ length: n }, (_, i) => Math.round(560 + 360 * Math.sin(i * 0.6 + p) + 140 * Math.cos(i * 1.7 + p))));
  /* 含负值/0/null 特性的单系列（基础柱专用：负值向下、0 值 1px 占位、null 断口全可见） */
  const signedWave = (n) => {
    const d = wave(n, 0.8).map((v) => v - 500000);
    if (n > 2) d[2] = 0;
    if (n > 4) d[4] = null;
    return d;
  };
  /* 多系列正值波形：按序相移 */
  const posSeries = (n, names) => names.map((name, k) => ({ name, data: wave(n, k * 0.9) }));
  /* 负值系列（堆叠含负值用） */
  const negWave = (n) => wave(n, 2).map((v) => -Math.round(v * 0.4));
  /* 折线：中途一个 null 断口 */
  const lineWave = (n) => { const d = wave(n, 0.4); d[Math.floor(n / 3)] = null; return d; };
  /* 副轴增速（%）：小数量级、与柱不同量纲 */
  const growth = (n) => Array.from({ length: n }, (_, i) => Math.round(12 + 9 * Math.sin(i * 0.5)));

  /* ── 图表分类（左栏）：每项 cfg = 类目数 n 的函数（n 来自右侧「数据量」旋钮），横跨三主题渲染 ── */
  const CATEGORIES = [
    {
      group: '柱状',
      id: 'basic', label: '基础柱（单系列）',
      desc: '单系列默认色（THS #3366FF）；含负值向下、0 值 1px 占位、null 断口。数据量↑看单柱容器收缩：step 跌破上限后柱按 2:1 等比收缩保侧白（BAR-03）、X 标签碰撞（AXIS-06）。',
      cfg: (n) => ({ categories: seq(n), series: [{ name: '营业收入', data: signedWave(n) }] }),
    },
    {
      group: '柱状',
      id: 'grouped3', label: '分组柱（3 系列）',
      desc: '一进多「整套换」：首色应变浅蓝 #52BBFF（≠ 单系列 #3366FF）；各主题按序号取色板。数据量↑看分组容器收缩（BAR-02）。',
      cfg: (n) => ({ categories: seq(n), series: posSeries(n, ['营业收入', '成本', '利润']) }),
    },
    {
      group: '柱状',
      id: 'grouped6', label: '分组柱（6 系列）',
      desc: '色板循环：点掉几个系列看剩余柱整组重新居中、颜色不重排（各系列色固定不跟随）。',
      cfg: (n) => ({ categories: seq(n), series: posSeries(n, ['营业收入', '成本', '利润', '税费', '研发投入', '现金流']) }),
    },
    {
      group: '堆叠',
      id: 'stack', label: '堆叠（normal）',
      desc: '段间直角、只最外端圆角（THS，正向最上/负向最下）；点掉一个系列看堆叠闭合、轴 refit。',
      cfg: (n) => ({ categories: seq(n), series: posSeries(n, ['营业收入', '成本', '利润']), stack: 'normal' }),
    },
    {
      group: '堆叠',
      id: 'stackNeg', label: '堆叠含负值',
      desc: '正值向上累计、负值向下累计（分开）。',
      cfg: (n) => ({
        categories: seq(n), stack: 'normal',
        series: [...posSeries(n, ['主营利润', '投资收益']), { name: '净亏损项', data: negWave(n) }],
      }),
    },
    {
      group: '堆叠',
      id: 'percent', label: '归一化（percent）',
      desc: '每类目顶到 100%、Y 轴 0–100%；点掉系列看占比重算。',
      cfg: (n) => ({ categories: seq(n), series: posSeries(n, ['营业收入', '成本', '利润']), stack: 'percent' }),
    },
    {
      group: '折线',
      id: 'line', label: '折线（单系列）',
      desc: '数据点显隐分档（移动/PC 一致）：≤13 点常显（少）、>13 全隐（中/多），线仍连续；null 断口不强连。点留 DOM（data-i），hover 十字准星唤出最近点归 tooltip 切片。',
      cfg: (n) => ({ categories: seq(n), series: [{ name: '指数', data: lineWave(n), type: 'line' }] }),
    },
    {
      group: '组合',
      id: 'combo', label: '折柱组合 · 双 Y',
      desc: '柱走主轴、线走副轴；两轴 0 对齐、刻度落同网格行。图例按真实 type 显方块/折线 marker。数据量中/多时副轴折线点也进入 >13 全隐档。',
      cfg: (n) => ({
        categories: seq(n),
        series: [
          { name: '营业收入', data: wave(n), type: 'bar', axis: 'primary' },
          { name: '成本', data: wave(n, 0.9), type: 'bar', axis: 'primary' },
          { name: '营收增速', data: growth(n), type: 'line', axis: 'secondary' },
        ],
      }),
    },
  ];

  const THEMES = [
    { id: 'ths', name: 'THS 同花顺', dot: '#3366FF' },
    { id: 'ifind-pc', name: 'iFinD PC', dot: '#4D5999' },
    { id: 'ainvest', name: 'Ainvest', dot: '#265FFC' },
  ];

  const DENSITY = { few: 4, mid: 16, many: 36 }; // 右侧「数据量」旋钮 → 类目数 n
  const state = { category: CATEGORIES[0].id, platform: 'pc', mode: 'light', density: 'few' };

  /* ── 左栏导航：按 group 分节 ─────────────────────────────────────── */
  const navEl = document.getElementById('nav');
  let lastGroup = null;
  CATEGORIES.forEach((cat) => {
    if (cat.group !== lastGroup) {
      const t = document.createElement('div');
      t.className = 'nav-group-title';
      t.textContent = cat.group;
      navEl.appendChild(t);
      lastGroup = cat.group;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.textContent = cat.label;
    btn.dataset.id = cat.id;
    btn.addEventListener('click', () => { state.category = cat.id; render(); });
    navEl.appendChild(btn);
  });

  /* ── 中栏：三主题卡片骨架（一次性建，重绘只换 chart-host）────────── */
  const canvasEl = document.getElementById('canvas');
  const cards = {};
  THEMES.forEach((t) => {
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.dataset.theme = t.id;
    card.innerHTML = `
      <div class="theme-card__bar">
        <span class="theme-card__dot" style="background:${t.dot}"></span>
        <span class="theme-card__name">${t.name}</span>
        <span class="theme-card__meta"></span>
      </div>
      <div class="chart-mount"></div>`;
    canvasEl.appendChild(card);
    cards[t.id] = card;
  });

  /* ── 渲染：当前分类 × 端 × 明暗 → 三卡整体重绘 ──────────────────── */
  function render() {
    const cat = CATEGORIES.find((c) => c.id === state.category);

    document.getElementById('cat-title').textContent = cat.label;
    document.getElementById('cat-desc').textContent = cat.desc;
    navEl.querySelectorAll('.nav-item').forEach((b) =>
      b.classList.toggle('is-active', b.dataset.id === state.category));

    THEMES.forEach((t) => {
      const card = cards[t.id];
      card.dataset.mode = state.mode;         // [data-mode] 明暗
      card.dataset.platform = state.platform; // [data-platform] 端（pc 时匹配空规则、无害）
      card.querySelector('.theme-card__meta').textContent =
        `${state.platform === 'pc' ? 'PC' : '移动端'} · ${state.mode === 'dark' ? '深色' : '浅色'}`;

      // 重建干净的 host，避免残留 class / --dv-series-* 变量
      const mount = card.querySelector('.chart-mount');
      mount.textContent = '';
      const host = document.createElement('div');
      host.className = 'chart-host';
      mount.appendChild(host);
      CartesianChart(host, { ...cat.cfg(DENSITY[state.density]), platform: state.platform });
    });
  }

  /* ── 右栏：端 / 明暗 分段控件 ───────────────────────────────────── */
  function wireSeg(id, key) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      state[key] = btn.dataset.value;
      seg.querySelectorAll('button').forEach((b) => b.classList.toggle('is-active', b === btn));
      render();
    });
  }
  wireSeg('seg-platform', 'platform');
  wireSeg('seg-mode', 'mode');
  wireSeg('seg-density', 'density');

  render();
</script>
</body>
</html>
