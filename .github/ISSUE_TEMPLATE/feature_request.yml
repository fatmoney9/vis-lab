name: 规范或能力需求
description: 提议新增或调整一项可视化规范与实现
title: "[需求] "
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 说明用户场景和要解决的问题，不要只描述实现方案。
    validations:
      required: true
  - type: input
    id: spec-id
    attributes:
      label: 相关规范 ID
      description: 已有规则填写现有 ID；新增规则可填写建议 ID 或“待分配”。
      placeholder: AXIS-06 / 待分配
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: 规则或交互说明
      description: 写清触发条件、边界情况以及主题或端差异。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] PC ……
        - [ ] 移动端 ……
        - [ ] 三主题 ……
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 设计稿、截图或参考资料
