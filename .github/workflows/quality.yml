name: 质量门禁

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # ⚠️ 这个 name 是 ruleset「保护main」登记的必需检查名，按字符串精确匹配。
    #    改名会让 PR 永远卡在等一个不会上报的检查上——要改必须同步去
    #    Settings → Rules → Rulesets → 保护main 改掉那一项。
    name: token、单测、分层与规范检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 检查清单住在 hooks/check.sh（唯一一份，本地 pre-commit 调的是同一个脚本）。
      # --verify：重建生成物后要求与提交内容零差异——CI 只验不改。
      - name: 运行质量门禁
        run: sh hooks/check.sh --verify
